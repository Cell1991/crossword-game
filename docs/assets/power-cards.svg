<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="cardsBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#0f172a" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>

    <!-- Power Card Glows -->
    <filter id="goldCardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="blueCardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes cardBob1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes cardBob2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes cardBob3 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes auraGlow {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 0.95; }
      }
      .card-float-1 { animation: cardBob1 3.8s ease-in-out infinite; }
      .card-float-2 { animation: cardBob2 4.2s ease-in-out infinite 0.4s; }
      .card-float-3 { animation: cardBob3 3.5s ease-in-out infinite 0.8s; }
      .card-float-4 { animation: cardBob1 4.0s ease-in-out infinite 1.2s; }
      .card-float-5 { animation: cardBob2 3.7s ease-in-out infinite 1.6s; }
      .card-float-6 { animation: cardBob3 4.4s ease-in-out infinite 2.0s; }
      .card-float-7 { animation: cardBob1 3.9s ease-in-out infinite 2.4s; }
      .aura-pulse { animation: auraGlow 2.5s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="1200" height="380" fill="url(#cardsBg)" rx="16"/>

  <!-- Section Header Inside Graphic -->
  <g transform="translate(600, 32)">
    <text x="0" y="0" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="4">
      ⚡ TACTICAL POWER CARD ARSENAL • MAXIMUM 3 CARDS IN HAND ⚡
    </text>
  </g>

  <!-- Card Row: 7 Primary Tactical Cards -->

  <!-- CARD 1: SHIELD -->
  <g class="card-float-1" transform="translate(30, 60)">
    <rect width="150" height="280" rx="12" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="150" height="36" rx="12" fill="#1d4ed8" fill-opacity="0.3"/>
    <text x="75" y="24" fill="#60a5fa" font-family="'Inter', sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1">DEFENSE</text>
    <circle cx="75" cy="80" r="30" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5" class="aura-pulse"/>
    <text x="75" y="92" font-size="30" text-anchor="middle">🛡️</text>
    <text x="75" y="135" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="14" font-weight="900" text-anchor="middle">SHIELD</text>
    <text x="75" y="155" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">REACTION / PASSIVE</text>
    <line x1="20" y1="170" x2="130" y2="170" stroke="#334155" stroke-width="1"/>
    <text x="75" y="195" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10" font-weight="500" text-anchor="middle">
      <tspan x="75" dy="0">Negates incoming</tspan>
      <tspan x="75" dy="14">attack damage</tspan>
      <tspan x="75" dy="14">or tile theft.</tspan>
    </text>
    <rect x="20" y="245" width="110" height="20" rx="10" fill="#1e293b"/>
    <text x="75" y="258" fill="#93c5fd" font-family="'Inter', sans-serif" font-size="9" font-weight="800" text-anchor="middle">1s REACTION WINDOW</text>
  </g>

  <!-- CARD 2: HEAL -->
  <g class="card-float-2" transform="translate(195, 60)">
    <rect width="150" height="280" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <rect x="0" y="0" width="150" height="36" rx="12" fill="#047857" fill-opacity="0.3"/>
    <text x="75" y="24" fill="#34d399" font-family="'Inter', sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1">RECOVERY</text>
    <circle cx="75" cy="80" r="30" fill="#064e3b" stroke="#34d399" stroke-width="1.5" class="aura-pulse"/>
    <text x="75" y="92" font-size="30" text-anchor="middle">💖</text>
    <text x="75" y="135" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="14" font-weight="900" text-anchor="middle">HEAL</text>
    <text x="75" y="155" fill="#6ee7b7" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">INSTANT SELF</text>
    <line x1="20" y1="170" x2="130" y2="170" stroke="#334155" stroke-width="1"/>
    <text x="75" y="195" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10" font-weight="500" text-anchor="middle">
      <tspan x="75" dy="0">Restores HP equal</tspan>
      <tspan x="75" dy="14">to sum of rack tile</tspan>
      <tspan x="75" dy="14">point values.</tspan>
    </text>
    <rect x="20" y="245" width="110" height="20" rx="10" fill="#1e293b"/>
    <text x="75" y="258" fill="#a7f3d0" font-family="'Inter', sans-serif" font-size="9" font-weight="800" text-anchor="middle">RACK-BASED HEALING</text>
  </g>

  <!-- CARD 3: FREEZE TILE -->
  <g class="card-float-3" transform="translate(360, 60)">
    <rect width="150" height="280" rx="12" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>
    <rect x="0" y="0" width="150" height="36" rx="12" fill="#0e7490" fill-opacity="0.3"/>
    <text x="75" y="24" fill="#22d3ee" font-family="'Inter', sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1">CONTROL</text>
    <circle cx="75" cy="80" r="30" fill="#164e63" stroke="#22d3ee" stroke-width="1.5" class="aura-pulse"/>
    <text x="75" y="92" font-size="30" text-anchor="middle">❄️</text>
    <text x="75" y="135" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="14" font-weight="900" text-anchor="middle">FREEZE TILE</text>
    <text x="75" y="155" fill="#67e8f9" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">BOARD TARGET</text>
    <line x1="20" y1="170" x2="130" y2="170" stroke="#334155" stroke-width="1"/>
    <text x="75" y="195" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10" font-weight="500" text-anchor="middle">
      <tspan x="75" dy="0">Locks a board tile.</tspan>
      <tspan x="75" dy="14">Opponents cannot</tspan>
      <tspan x="75" dy="14">connect words to it.</tspan>
    </text>
    <rect x="20" y="245" width="110" height="20" rx="10" fill="#1e293b"/>
    <text x="75" y="258" fill="#bae6fd" font-family="'Inter', sans-serif" font-size="9" font-weight="800" text-anchor="middle">UNTIL NEXT TURN</text>
  </g>

  <!-- CARD 4: DESTROY TILE -->
  <g class="card-float-4" transform="translate(525, 60)">
    <rect width="150" height="280" rx="12" fill="#0f172a" stroke="#f97316" stroke-width="2"/>
    <rect x="0" y="0" width="150" height="36" rx="12" fill="#c2410c" fill-opacity="0.3"/>
    <text x="75" y="24" fill="#fb923c" font-family="'Inter', sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1">DEMOLISH</text>
    <circle cx="75" cy="80" r="30" fill="#7c2d12" stroke="#fb923c" stroke-width="1.5" class="aura-pulse"/>
    <text x="75" y="92" font-size="30" text-anchor="middle">💥</text>
    <text x="75" y="135" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="14" font-weight="900" text-anchor="middle">DESTROY</text>
    <text x="75" y="155" fill="#fed7aa" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">BOARD TARGET</text>
    <line x1="20" y1="170" x2="130" y2="170" stroke="#334155" stroke-width="1"/>
    <text x="75" y="195" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10" font-weight="500" text-anchor="middle">
      <tspan x="75" dy="0">Obliterates 1 tile</tspan>
      <tspan x="75" dy="14">from the board to</tspan>
      <tspan x="75" dy="14">reopen 3L cells.</tspan>
    </text>
    <rect x="20" y="245" width="110" height="20" rx="10" fill="#1e293b"/>
    <text x="75" y="258" fill="#fed7aa" font-family="'Inter', sans-serif" font-size="9" font-weight="800" text-anchor="middle">REOPENS HOTSPOTS</text>
  </g>

  <!-- CARD 5: DOUBLE DAMAGE -->
  <g class="card-float-5" transform="translate(690, 60)">
    <rect width="150" height="280" rx="12" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="150" height="36" rx="12" fill="#b91c1c" fill-opacity="0.3"/>
    <text x="75" y="24" fill="#f87171" font-family="'Inter', sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1">OFFENSE</text>
    <circle cx="75" cy="80" r="30" fill="#991b1b" stroke="#f87171" stroke-width="1.5" class="aura-pulse"/>
    <text x="75" y="92" font-size="30" text-anchor="middle">⚔️</text>
    <text x="75" y="135" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="14" font-weight="900" text-anchor="middle">2X DAMAGE</text>
    <text x="75" y="155" fill="#fca5a5" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">TARGET RIVAL</text>
    <line x1="20" y1="170" x2="130" y2="170" stroke="#334155" stroke-width="1"/>
    <text x="75" y="195" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10" font-weight="500" text-anchor="middle">
      <tspan x="75" dy="0">Your next word</tspan>
      <tspan x="75" dy="14">deals 2× lethal</tspan>
      <tspan x="75" dy="14">attack damage.</tspan>
    </text>
    <rect x="20" y="245" width="110" height="20" rx="10" fill="#1e293b"/>
    <text x="75" y="258" fill="#fca5a5" font-family="'Inter', sans-serif" font-size="9" font-weight="800" text-anchor="middle">200% STRIKE POWER</text>
  </g>

  <!-- CARD 6: SPY SWAP -->
  <g class="card-float-6" transform="translate(855, 60)">
    <rect width="150" height="280" rx="12" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
    <rect x="0" y="0" width="150" height="36" rx="12" fill="#7e22ce" fill-opacity="0.3"/>
    <text x="75" y="24" fill="#c084fc" font-family="'Inter', sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1">ESPIONAGE</text>
    <circle cx="75" cy="80" r="30" fill="#581c87" stroke="#c084fc" stroke-width="1.5" class="aura-pulse"/>
    <text x="75" y="92" font-size="30" text-anchor="middle">🔄</text>
    <text x="75" y="135" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="14" font-weight="900" text-anchor="middle">SPY SWAP</text>
    <text x="75" y="155" fill="#d8b4fe" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">TARGET RIVAL</text>
    <line x1="20" y1="170" x2="130" y2="170" stroke="#334155" stroke-width="1"/>
    <text x="75" y="195" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10" font-weight="500" text-anchor="middle">
      <tspan x="75" dy="0">Steals 1 to 3</tspan>
      <tspan x="75" dy="14">tiles directly from</tspan>
      <tspan x="75" dy="14">rival&apos;s rack.</tspan>
    </text>
    <rect x="20" y="245" width="110" height="20" rx="10" fill="#1e293b"/>
    <text x="75" y="258" fill="#e9d5ff" font-family="'Inter', sans-serif" font-size="9" font-weight="800" text-anchor="middle">TACTICAL THEFT</text>
  </g>

  <!-- CARD 7: HINT -->
  <g class="card-float-7" transform="translate(1020, 60)">
    <rect width="150" height="280" rx="12" fill="#0f172a" stroke="#eab308" stroke-width="2"/>
    <rect x="0" y="0" width="150" height="36" rx="12" fill="#a16207" fill-opacity="0.3"/>
    <text x="75" y="24" fill="#fde047" font-family="'Inter', sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1">INTEL</text>
    <circle cx="75" cy="80" r="30" fill="#713f12" stroke="#fde047" stroke-width="1.5" class="aura-pulse"/>
    <text x="75" y="92" font-size="30" text-anchor="middle">👁️</text>
    <text x="75" y="135" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="14" font-weight="900" text-anchor="middle">HINT</text>
    <text x="75" y="155" fill="#fef08a" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">AI SOLVER</text>
    <line x1="20" y1="170" x2="130" y2="170" stroke="#334155" stroke-width="1"/>
    <text x="75" y="195" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10" font-weight="500" text-anchor="middle">
      <tspan x="75" dy="0">Reveals top 3</tspan>
      <tspan x="75" dy="14">highest scoring</tspan>
      <tspan x="75" dy="14">legal word moves.</tspan>
    </text>
    <rect x="20" y="245" width="110" height="20" rx="10" fill="#1e293b"/>
    <text x="75" y="258" fill="#fef08a" font-family="'Inter', sans-serif" font-size="9" font-weight="800" text-anchor="middle">AI CANDIDATE SOLVER</text>
  </g>
</svg>
