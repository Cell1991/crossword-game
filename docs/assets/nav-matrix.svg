<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="navBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#090d16" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>

    <!-- Glowing Drop Shadow Filter -->
    <filter id="navGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <style>
      @keyframes slowHudGlow {
        0%, 100% { stroke-opacity: 0.35; }
        50% { stroke-opacity: 0.95; }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -32; }
      }
      .hud-line { stroke-dasharray: 4 4; animation: slowHudGlow 4s ease-in-out infinite; }
      .stream-anim { stroke-dasharray: 6 6; animation: dashMove 3s linear infinite; }
      .nav-card { transition: all 0.3s ease; }
    </style>
  </defs>

  <!-- Container Base -->
  <rect width="1200" height="240" fill="url(#navBg)" rx="16"/>

  <!-- Top Title / HUD Header -->
  <g transform="translate(600, 26)">
    <text x="0" y="0" fill="#64748b" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="900" text-anchor="middle" letter-spacing="4">
      CROSSWORD BATTLE ARENA • TACTICAL NAVIGATION SITEMAP
    </text>
  </g>

  <!-- Central Bus / Grid Lines -->
  <path d="M 60 115 L 1140 115" stroke="#1e293b" stroke-width="2"/>
  <path d="M 60 115 L 1140 115" stroke="#38bdf8" stroke-width="1.5" class="stream-anim" opacity="0.4"/>

  <!-- ==================== ROW 1 (TOP 5 CARDS) ==================== -->
  
  <!-- 1. BENTO GRID -->
  <g transform="translate(30, 42)" filter="url(#navGlow)">
    <rect width="215" height="70" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.2"/>
    <rect x="0" y="0" width="215" height="24" rx="10" fill="#0369a1" fill-opacity="0.3"/>
    <text x="12" y="16" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="10" font-weight="900" letter-spacing="0.5">🍱 01. BENTO GRID</text>
    <text x="12" y="44" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="800">Feature Matrix</text>
    <text x="12" y="58" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9.5" font-weight="500">60 FPS Canvas • AI Triad</text>
  </g>

  <!-- 2. GAME MODES -->
  <g transform="translate(265, 42)" filter="url(#navGlow)">
    <rect width="215" height="70" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="1.2"/>
    <rect x="0" y="0" width="215" height="24" rx="10" fill="#991b1b" fill-opacity="0.3"/>
    <text x="12" y="16" fill="#fca5a5" font-family="'Inter', sans-serif" font-size="10" font-weight="900" letter-spacing="0.5">🎮 02. GAME MODES</text>
    <text x="12" y="44" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="800">HP &amp; Turn Arena</text>
    <text x="12" y="58" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9.5" font-weight="500">Deathmatch • Spectators</text>
  </g>

  <!-- 3. POWER CARDS -->
  <g transform="translate(500, 42)" filter="url(#navGlow)">
    <rect width="200" height="70" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
    <rect x="0" y="0" width="200" height="24" rx="10" fill="#78350f" fill-opacity="0.3"/>
    <text x="12" y="16" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="10" font-weight="900" letter-spacing="0.5">⚡ 03. POWER CARDS</text>
    <text x="12" y="44" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="800">11 Tactical Spells</text>
    <text x="12" y="58" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9.5" font-weight="500">Shield • Freeze • Heal</text>
  </g>

  <!-- 4. MATRIX &amp; MULTIPLIERS -->
  <g transform="translate(720, 42)" filter="url(#navGlow)">
    <rect width="215" height="70" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
    <rect x="0" y="0" width="215" height="24" rx="10" fill="#064e3b" fill-opacity="0.3"/>
    <text x="12" y="16" fill="#6ee7b7" font-family="'Inter', sans-serif" font-size="10" font-weight="900" letter-spacing="0.5">📐 04. 19×27 MATRIX</text>
    <text x="12" y="44" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="800">Grid Geometry</text>
    <text x="12" y="58" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9.5" font-weight="500">3L / 2L / ★ Multipliers</text>
  </g>

  <!-- 5. COMBAT LIFECYCLE -->
  <g transform="translate(955, 42)" filter="url(#navGlow)">
    <rect width="215" height="70" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="1.2"/>
    <rect x="0" y="0" width="215" height="24" rx="10" fill="#3730a3" fill-opacity="0.3"/>
    <text x="12" y="16" fill="#c7d2fe" font-family="'Inter', sans-serif" font-size="10" font-weight="900" letter-spacing="0.5">🔄 05. COMBAT FLOW</text>
    <text x="12" y="44" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="800">1.0s Reaction Window</text>
    <text x="12" y="58" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9.5" font-weight="500">Arbitration Sequence</text>
  </g>

  <!-- ==================== ROW 2 (BOTTOM 5 CARDS) ==================== -->

  <!-- 6. ARCHITECTURE -->
  <g transform="translate(30, 140)" filter="url(#navGlow)">
    <rect width="215" height="70" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.2"/>
    <rect x="0" y="0" width="215" height="24" rx="10" fill="#0369a1" fill-opacity="0.3"/>
    <text x="12" y="16" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="10" font-weight="900" letter-spacing="0.5">🏗️ 06. ARCHITECTURE</text>
    <text x="12" y="44" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="800">Full-Stack Dataflow</text>
    <text x="12" y="58" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9.5" font-weight="500">FastAPI • Next.js 16</text>
  </g>

  <!-- 7. DATABASE ERD -->
  <g transform="translate(265, 140)" filter="url(#navGlow)">
    <rect width="215" height="70" rx="10" fill="#0f172a" stroke="#c084fc" stroke-width="1.2"/>
    <rect x="0" y="0" width="215" height="24" rx="10" fill="#581c87" fill-opacity="0.3"/>
    <text x="12" y="16" fill="#e9d5ff" font-family="'Inter', sans-serif" font-size="10" font-weight="900" letter-spacing="0.5">🗄️ 07. DATABASE ERD</text>
    <text x="12" y="44" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="800">SQLAlchemy Models</text>
    <text x="12" y="58" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9.5" font-weight="500">Rooms • Players • Lexicon</text>
  </g>

  <!-- 8. DIRECTORY TREE -->
  <g transform="translate(500, 140)" filter="url(#navGlow)">
    <rect width="200" height="70" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
    <rect x="0" y="0" width="200" height="24" rx="10" fill="#78350f" fill-opacity="0.3"/>
    <text x="12" y="16" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="10" font-weight="900" letter-spacing="0.5">📂 08. CODE TREE</text>
    <text x="12" y="44" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="800">Directory Layout</text>
    <text x="12" y="58" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9.5" font-weight="500">Monorepo Structure</text>
  </g>

  <!-- 9. QUICK START -->
  <g transform="translate(720, 140)" filter="url(#navGlow)">
    <rect width="215" height="70" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
    <rect x="0" y="0" width="215" height="24" rx="10" fill="#064e3b" fill-opacity="0.3"/>
    <text x="12" y="16" fill="#6ee7b7" font-family="'Inter', sans-serif" font-size="10" font-weight="900" letter-spacing="0.5">🚀 09. QUICK START</text>
    <text x="12" y="44" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="800">Docker &amp; SQLite Setup</text>
    <text x="12" y="58" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9.5" font-weight="500">Zero-Config Launch</text>
  </g>

  <!-- 10. API &amp; WEBSOCKET -->
  <g transform="translate(955, 140)" filter="url(#navGlow)">
    <rect width="215" height="70" rx="10" fill="#0f172a" stroke="#f43f5e" stroke-width="1.2"/>
    <rect x="0" y="0" width="215" height="24" rx="10" fill="#881337" fill-opacity="0.3"/>
    <text x="12" y="16" fill="#fda4af" font-family="'Inter', sans-serif" font-size="10" font-weight="900" letter-spacing="0.5">📡 10. API &amp; WS SPEC</text>
    <text x="12" y="44" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="800">Endpoints &amp; Events</text>
    <text x="12" y="58" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9.5" font-weight="500">REST &amp; Live Stream</text>
  </g>
</svg>
