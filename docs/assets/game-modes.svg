<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Card Gradients -->
    <linearGradient id="cardBg1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cardBg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cardBg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#701a75" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cardBg4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- HP Bar Gradient -->
    <linearGradient id="hpBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Glow & Drop Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glowSubtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes pulseBorder {
        0%, 100% { stroke-opacity: 0.35; }
        50% { stroke-opacity: 0.95; }
      }
      @keyframes hpDeplete {
        0%, 100% { width: 180px; }
        50% { width: 90px; }
      }
      .pulsing-border-red { animation: pulseBorder 5.5s ease-in-out infinite; }
      .pulsing-border-green { animation: pulseBorder 6.2s ease-in-out infinite 0.8s; }
      .pulsing-border-purple { animation: pulseBorder 5.8s ease-in-out infinite 1.6s; }
      .pulsing-border-cyan { animation: pulseBorder 6.5s ease-in-out infinite 2.4s; }
      .anim-hp-bar { animation: hpDeplete 7.0s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="360" fill="#030712" rx="16"/>

  <!-- ==================== CARD 1: HP DEATHMATCH ==================== -->
  <g transform="translate(25, 20)" filter="url(#cardShadow)">
    <rect width="265" height="320" rx="14" fill="url(#cardBg1)" stroke="#ef4444" stroke-width="1.5" class="pulsing-border-red"/>
    <!-- Card Header Banner -->
    <rect x="0" y="0" width="265" height="42" rx="14" fill="#991b1b" fill-opacity="0.4"/>
    <text x="20" y="27" fill="#fca5a5" font-family="'Inter', sans-serif" font-size="14" font-weight="900" letter-spacing="1">
      ⚔️ HP DEATHMATCH
    </text>
    <rect x="185" y="10" width="65" height="22" rx="11" fill="#7f1d1d" stroke="#ef4444" stroke-width="1"/>
    <text x="217" y="25" fill="#fee2e2" font-family="'Inter', sans-serif" font-size="10" font-weight="800" text-anchor="middle">COMBAT</text>

    <!-- Content -->
    <text x="20" y="70" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="16" font-weight="800">Survival Elimination</text>
    <text x="20" y="90" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11.5" font-weight="500">
      Points deal lethal damage to opponents.
    </text>

    <!-- Animated HP Bar Demo -->
    <g transform="translate(20, 110)">
      <rect width="225" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <rect width="180" height="20" x="3" y="3" rx="4" fill="url(#hpBarGrad)" class="anim-hp-bar"/>
      <text x="112" y="17" fill="#ffffff" font-family="'Inter', sans-serif" font-size="10.5" font-weight="900" text-anchor="middle" letter-spacing="1">
        HP: 75 / 100
      </text>
    </g>

    <!-- Feature Checklist -->
    <g transform="translate(20, 160)" font-family="'Inter', sans-serif" font-size="11.5" fill="#cbd5e1">
      <text y="0" font-weight="700" fill="#f87171">💥 Direct Damage on Words</text>
      <text y="24" fill="#94a3b8">🛡️ 1s Reactive Shield Window</text>
      <text y="48" fill="#94a3b8">💖 Rack-based Life Steal / Heal</text>
      <text y="72" fill="#94a3b8">☠️ 0 HP = Spectator Demotion</text>
    </g>

    <!-- Bottom Tag -->
    <g transform="translate(20, 275)">
      <rect width="225" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="112" y="18" fill="#f87171" font-family="'Inter', sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">
        CONFIGURABLE: 10 - 1000 HP
      </text>
    </g>
  </g>

  <!-- ==================== CARD 2: TURN COUNT MODE ==================== -->
  <g transform="translate(315, 20)" filter="url(#cardShadow)">
    <rect width="265" height="320" rx="14" fill="url(#cardBg2)" stroke="#10b981" stroke-width="1.5" class="pulsing-border-green"/>
    <!-- Card Header Banner -->
    <rect x="0" y="0" width="265" height="42" rx="14" fill="#065f46" fill-opacity="0.4"/>
    <text x="20" y="27" fill="#6ee7b7" font-family="'Inter', sans-serif" font-size="14" font-weight="900" letter-spacing="1">
      🏆 TURN COUNT
    </text>
    <rect x="185" y="10" width="65" height="22" rx="11" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="217" y="25" fill="#d1fae5" font-family="'Inter', sans-serif" font-size="10" font-weight="800" text-anchor="middle">CLASSIC</text>

    <!-- Content -->
    <text x="20" y="70" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="16" font-weight="800">Tournament Scoring</text>
    <text x="20" y="90" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11.5" font-weight="500">
      Pure tactical crossword dominance.
    </text>

    <!-- Turn Counter Pill Demo -->
    <g transform="translate(20, 110)">
      <rect width="225" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <rect width="130" height="20" x="3" y="3" rx="4" fill="#059669"/>
      <text x="112" y="17" fill="#ffffff" font-family="'Inter', sans-serif" font-size="10.5" font-weight="900" text-anchor="middle" letter-spacing="1">
        TURN 12 OF 28 ROUNDS
      </text>
    </g>

    <!-- Feature Checklist -->
    <g transform="translate(20, 160)" font-family="'Inter', sans-serif" font-size="11.5" fill="#cbd5e1">
      <text y="0" font-weight="700" fill="#34d399">🎯 Cumulative Score Victory</text>
      <text y="24" fill="#94a3b8">🚫 HP Cards Excluded from Deck</text>
      <text y="48" fill="#94a3b8">📐 Maximum 3L / 2L Grid Yield</text>
      <text y="72" fill="#94a3b8">⭐ 50-Point Bingo Priority</text>
    </g>

    <!-- Bottom Tag -->
    <g transform="translate(20, 275)">
      <rect width="225" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="112" y="18" fill="#34d399" font-family="'Inter', sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">
        ROUNDS: 7, 14, 21, 28... 500
      </text>
    </g>
  </g>

  <!-- ==================== CARD 3: AI BOT ARENA ==================== -->
  <g transform="translate(605, 20)" filter="url(#cardShadow)">
    <rect width="265" height="320" rx="14" fill="url(#cardBg3)" stroke="#c084fc" stroke-width="1.5" class="pulsing-border-purple"/>
    <!-- Card Header Banner -->
    <rect x="0" y="0" width="265" height="42" rx="14" fill="#581c87" fill-opacity="0.4"/>
    <text x="20" y="27" fill="#e9d5ff" font-family="'Inter', sans-serif" font-size="14" font-weight="900" letter-spacing="1">
      🤖 AI BOT ARENA
    </text>
    <rect x="185" y="10" width="65" height="22" rx="11" fill="#4a044e" stroke="#c084fc" stroke-width="1"/>
    <text x="217" y="25" fill="#fae8ff" font-family="'Inter', sans-serif" font-size="10" font-weight="800" text-anchor="middle">3 TIERS</text>

    <!-- Content -->
    <text x="20" y="70" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="16" font-weight="800">Autonomous Solvers</text>
    <text x="20" y="90" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11.5" font-weight="500">
      Practice solo or fill empty room seats.
    </text>

    <!-- Bot Tier Badges -->
    <g transform="translate(20, 110)">
      <rect x="0" y="0" width="70" height="26" rx="5" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1"/>
      <text x="35" y="17" fill="#7dd3fc" font-family="'Inter', sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">⚡ Spark</text>
      <rect x="77" y="0" width="70" height="26" rx="5" fill="#7c3aed" fill-opacity="0.3" stroke="#a78bfa" stroke-width="1"/>
      <text x="112" y="17" fill="#c4b5fd" font-family="'Inter', sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">🔮 Nexus</text>
      <rect x="155" y="0" width="70" height="26" rx="5" fill="#be185d" fill-opacity="0.3" stroke="#f472b6" stroke-width="1"/>
      <text x="190" y="17" fill="#fbcfe8" font-family="'Inter', sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">🛡️ Titan</text>
    </g>

    <!-- Feature Checklist -->
    <g transform="translate(20, 160)" font-family="'Inter', sans-serif" font-size="11.5" fill="#cbd5e1">
      <text y="0" font-weight="700" fill="#c084fc">⚡ Auto-Scheduled Turns</text>
      <text y="24" fill="#94a3b8">🧠 CSW24 Anagram Solver</text>
      <text y="48" fill="#94a3b8">🔄 Exchange & Pass Intelligence</text>
      <text y="72" fill="#94a3b8">🎮 Solo Offline Ready</text>
    </g>

    <!-- Bottom Tag -->
    <g transform="translate(20, 275)">
      <rect width="225" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="112" y="18" fill="#c084fc" font-family="'Inter', sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">
        EASY • MEDIUM • HARD
      </text>
    </g>
  </g>

  <!-- ==================== CARD 4: SPECTATOR & REVIEWS ==================== -->
  <g transform="translate(895, 20)" filter="url(#cardShadow)">
    <rect width="265" height="320" rx="14" fill="url(#cardBg4)" stroke="#38bdf8" stroke-width="1.5" class="pulsing-border-cyan"/>
    <!-- Card Header Banner -->
    <rect x="0" y="0" width="265" height="42" rx="14" fill="#0369a1" fill-opacity="0.4"/>
    <text x="20" y="27" fill="#7dd3fc" font-family="'Inter', sans-serif" font-size="14" font-weight="900" letter-spacing="1">
      👁️ SPECTATOR & FEED
    </text>
    <rect x="185" y="10" width="65" height="22" rx="11" fill="#075985" stroke="#38bdf8" stroke-width="1"/>
    <text x="217" y="25" fill="#e0f2fe" font-family="'Inter', sans-serif" font-size="10" font-weight="800" text-anchor="middle">LIVE</text>

    <!-- Content -->
    <text x="20" y="70" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="16" font-weight="800">Zero-Seat Spectating</text>
    <text x="20" y="90" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11.5" font-weight="500">
      Watch matches with real-time sync.
    </text>

    <!-- Ghost Preview Pill Demo -->
    <g transform="translate(20, 110)">
      <rect width="225" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <rect width="160" height="20" x="3" y="3" rx="4" fill="#0284c7" fill-opacity="0.6"/>
      <text x="112" y="17" fill="#ffffff" font-family="'Inter', sans-serif" font-size="10.5" font-weight="900" text-anchor="middle" letter-spacing="1">
        GHOST TILE PLACEMENTS
      </text>
    </g>

    <!-- Feature Checklist -->
    <g transform="translate(20, 160)" font-family="'Inter', sans-serif" font-size="11.5" fill="#cbd5e1">
      <text y="0" font-weight="700" fill="#38bdf8">👻 Live Placement Ghosting</text>
      <text y="24" fill="#94a3b8">📜 Move History & Word Defs</text>
      <text y="48" fill="#94a3b8">🔒 Hidden Racks (Anti-Cheat)</text>
      <text y="72" fill="#94a3b8">🔁 Instant Rematch Lobby</text>
    </g>

    <!-- Bottom Tag -->
    <g transform="translate(20, 275)">
      <rect width="225" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="112" y="18" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">
        UNLIMITED SPECTATORS
      </text>
    </g>
  </g>
</svg>
