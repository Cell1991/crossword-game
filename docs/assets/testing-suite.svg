<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="testBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#090d16" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>

    <!-- Glowing Drop Shadow Filter -->
    <filter id="testShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <style>
      @keyframes pulseTestGlow {
        0%, 100% { stroke-opacity: 0.4; }
        50% { stroke-opacity: 1.0; }
      }
      .anim-test-pass { animation: pulseTestGlow 3.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="200" fill="url(#testBg)" rx="16"/>

  <!-- Top Title / HUD Header -->
  <g transform="translate(600, 26)">
    <text x="0" y="0" fill="#64748b" font-family="'Inter', sans-serif" font-size="10" font-weight="900" text-anchor="middle" letter-spacing="4">
      AUTOMATED TEST HARNESS &amp; VERIFICATION MATRIX
    </text>
  </g>

  <!-- 4 Verification Pillar Cards -->
  
  <!-- Pillar 1: Lexicon & Board Rules -->
  <g transform="translate(30, 48)" filter="url(#testShadow)">
    <rect width="265" height="125" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.2" class="anim-test-pass"/>
    <rect x="0" y="0" width="265" height="28" rx="12" fill="#064e3b" fill-opacity="0.4"/>
    <text x="15" y="19" fill="#6ee7b7" font-family="'Inter', sans-serif" font-size="11" font-weight="900">📖 LEXICON &amp; MATRIX</text>
    <rect x="205" y="6" width="48" height="16" rx="8" fill="#065f46" stroke="#10b981" stroke-width="1"/>
    <text x="229" y="18" fill="#d1fae5" font-family="'Inter', sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">PASSED</text>
    <text x="15" y="52" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="800">Scrabble Rules Engine</text>
    <text x="15" y="72" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" font-weight="500">
      <tspan x="15" dy="0">• CSW24 orthogonal checks</tspan>
      <tspan x="15" dy="16">• 19×27 mirror math &amp; Bingos</tspan>
      <tspan x="15" dy="16">• Multiplier calculations</tspan>
    </text>
  </g>

  <!-- Pillar 2: Combat & HP Damage -->
  <g transform="translate(320, 48)" filter="url(#testShadow)">
    <rect width="265" height="125" rx="12" fill="#0f172a" stroke="#ef4444" stroke-width="1.2" class="anim-test-pass"/>
    <rect x="0" y="0" width="265" height="28" rx="12" fill="#991b1b" fill-opacity="0.4"/>
    <text x="15" y="19" fill="#fca5a5" font-family="'Inter', sans-serif" font-size="11" font-weight="900">⚔️ COMBAT &amp; HP</text>
    <rect x="205" y="6" width="48" height="16" rx="8" fill="#7f1d1d" stroke="#ef4444" stroke-width="1"/>
    <text x="229" y="18" fill="#fee2e2" font-family="'Inter', sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">PASSED</text>
    <text x="15" y="52" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="800">Damage Arbitration</text>
    <text x="15" y="72" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" font-weight="500">
      <tspan x="15" dy="0">• 1.0s Shield reaction delay</tspan>
      <tspan x="15" dy="16">• Rack heal calculation</tspan>
      <tspan x="15" dy="16">• 0 HP spectator demotion</tspan>
    </text>
  </g>

  <!-- Pillar 3: Tactical Power Cards -->
  <g transform="translate(610, 48)" filter="url(#testShadow)">
    <rect width="265" height="125" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2" class="anim-test-pass"/>
    <rect x="0" y="0" width="265" height="28" rx="12" fill="#78350f" fill-opacity="0.4"/>
    <text x="15" y="19" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="11" font-weight="900">⚡ 11 POWER CARDS</text>
    <rect x="205" y="6" width="48" height="16" rx="8" fill="#78350f" stroke="#f59e0b" stroke-width="1"/>
    <text x="229" y="18" fill="#fef08a" font-family="'Inter', sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">PASSED</text>
    <text x="15" y="52" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="800">Spells &amp; Effects Matrix</text>
    <text x="15" y="72" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" font-weight="500">
      <tspan x="15" dy="0">• Freeze &amp; Destroy tile lifecycle</tspan>
      <tspan x="15" dy="16">• Spy Swap inventory transfer</tspan>
      <tspan x="15" dy="16">• Double Damage &amp; Hint AI</tspan>
    </text>
  </g>

  <!-- Pillar 4: WebSocket & Reconnect -->
  <g transform="translate(900, 48)" filter="url(#testShadow)">
    <rect width="270" height="125" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" class="anim-test-pass"/>
    <rect x="0" y="0" width="270" height="28" rx="12" fill="#0369a1" fill-opacity="0.4"/>
    <text x="15" y="19" fill="#7dd3fc" font-family="'Inter', sans-serif" font-size="11" font-weight="900">📡 WEBSOCKET &amp; ROOM</text>
    <rect x="210" y="6" width="48" height="16" rx="8" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1"/>
    <text x="234" y="18" fill="#e0f2fe" font-family="'Inter', sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">PASSED</text>
    <text x="15" y="52" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="800">Sync &amp; Rematch Lifecycle</text>
    <text x="15" y="72" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" font-weight="500">
      <tspan x="15" dy="0">• 15s Reconnection grace</tspan>
      <tspan x="15" dy="16">• Real-time ghost placement</tspan>
      <tspan x="15" dy="16">• Rematch lobby sync</tspan>
    </text>
  </g>
</svg>
