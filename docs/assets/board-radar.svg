<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="radarBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0b132b" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>

    <!-- In-Game Authentic Wood Tile Linear Gradient -->
    <linearGradient id="woodTileFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="28%" stop-color="#f59e0b"/>
      <stop offset="65%" stop-color="#d97706"/>
      <stop offset="88%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Tile Top Gloss Highlight -->
    <linearGradient id="tileGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- 3D Tile Drop Shadow -->
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <!-- Card Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <style>
      @keyframes starPulse {
        0%, 100% { stroke-opacity: 0.4; stroke-width: 1.5; filter: drop-shadow(0 0 4px #fbbf24); }
        50% { stroke-opacity: 1.0; stroke-width: 2.5; filter: drop-shadow(0 0 10px #f59e0b); }
      }
      @keyframes powerPulse {
        0%, 100% { stroke-opacity: 0.5; filter: drop-shadow(0 0 3px #22d3ee); }
        50% { stroke-opacity: 1.0; filter: drop-shadow(0 0 8px #06b6d4); }
      }
      .anim-star-center { animation: starPulse 3.5s ease-in-out infinite; }
      .anim-power-cell { animation: powerPulse 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="400" fill="url(#radarBg)" rx="16"/>

  <!-- ========================================================================= -->
  <!-- LEFT: AUTHENTIC 19x27 IN-GAME BOARD VIEW WITH WOOD TILES & MULTIPLIERS   -->
  <!-- ========================================================================= -->
  <g transform="translate(35, 20)">
    <!-- Board Outer Casing -->
    <rect width="610" height="360" rx="12" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>
    
    <!-- Header Title -->
    <text x="20" y="26" fill="#64748b" font-family="'Inter', sans-serif" font-size="10.5" font-weight="900" letter-spacing="2">
      TACTICAL MATRIX RADAR • IN-GAME CANVAS ENGINE
    </text>

    <!-- Inner Grid Board Frame -->
    <rect x="20" y="40" width="570" height="300" rx="8" fill="#030712" stroke="#334155" stroke-width="1"/>

    <!-- In-Game Golden Grid Mesh (rgba(245, 190, 72, 0.22)) -->
    <g stroke="rgba(245, 190, 72, 0.20)" stroke-width="0.8">
      <!-- Horizontal lines -->
      <line x1="20" y1="73" x2="590" y2="73"/>
      <line x1="20" y1="106" x2="590" y2="106"/>
      <line x1="20" y1="140" x2="590" y2="140"/>
      <line x1="20" y1="173" x2="590" y2="173"/>
      <line x1="20" y1="206" x2="590" y2="206"/>
      <line x1="20" y1="240" x2="590" y2="240"/>
      <line x1="20" y1="273" x2="590" y2="273"/>
      <line x1="20" y1="306" x2="590" y2="306"/>

      <!-- Vertical lines -->
      <line x1="58" y1="40" x2="58" y2="340"/>
      <line x1="96" y1="40" x2="96" y2="340"/>
      <line x1="134" y1="40" x2="134" y2="340"/>
      <line x1="172" y1="40" x2="172" y2="340"/>
      <line x1="210" y1="40" x2="210" y2="340"/>
      <line x1="248" y1="40" x2="248" y2="340"/>
      <line x1="286" y1="40" x2="286" y2="340"/>
      <line x1="324" y1="40" x2="324" y2="340"/>
      <line x1="362" y1="40" x2="362" y2="340"/>
      <line x1="400" y1="40" x2="400" y2="340"/>
      <line x1="438" y1="40" x2="438" y2="340"/>
      <line x1="476" y1="40" x2="476" y2="340"/>
      <line x1="514" y1="40" x2="514" y2="340"/>
      <line x1="552" y1="40" x2="552" y2="340"/>
    </g>

    <!-- Radar Range Guides -->
    <circle cx="305" cy="190" r="65" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 4"/>
    <circle cx="305" cy="190" r="125" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.15"/>

    <!-- ==================== IN-GAME AUTHENTIC SPECIAL CELLS ==================== -->
    
    <!-- 3L Fire Cells (#7f1d1d background, #ef4444 border, white 3L text) -->
    <g>
      <!-- 3L Top Left -->
      <rect x="98" y="75" width="34" height="29" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.2"/>
      <rect x="100" y="77" width="30" height="25" rx="3" fill="#ef4444" fill-opacity="0.2"/>
      <text x="115" y="94" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" text-anchor="middle">3L</text>

      <!-- 3L Top Right -->
      <rect x="478" y="75" width="34" height="29" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.2"/>
      <rect x="480" y="77" width="30" height="25" rx="3" fill="#ef4444" fill-opacity="0.2"/>
      <text x="495" y="94" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" text-anchor="middle">3L</text>

      <!-- 3L Bottom Left -->
      <rect x="98" y="275" width="34" height="29" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.2"/>
      <rect x="100" y="277" width="30" height="25" rx="3" fill="#ef4444" fill-opacity="0.2"/>
      <text x="115" y="294" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" text-anchor="middle">3L</text>

      <!-- 3L Bottom Right -->
      <rect x="478" y="275" width="34" height="29" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.2"/>
      <rect x="480" y="277" width="30" height="25" rx="3" fill="#ef4444" fill-opacity="0.2"/>
      <text x="495" y="294" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" text-anchor="middle">3L</text>
    </g>

    <!-- 2L Earth Cells (#166534 background, #22c55e border, white 2L text) -->
    <g>
      <rect x="212" y="108" width="34" height="30" rx="4" fill="#166534" stroke="#22c55e" stroke-width="1.2"/>
      <text x="229" y="128" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" text-anchor="middle">2L</text>

      <rect x="364" y="108" width="34" height="30" rx="4" fill="#166534" stroke="#22c55e" stroke-width="1.2"/>
      <text x="381" y="128" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" text-anchor="middle">2L</text>

      <rect x="212" y="242" width="34" height="30" rx="4" fill="#166534" stroke="#22c55e" stroke-width="1.2"/>
      <text x="229" y="262" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" text-anchor="middle">2L</text>

      <rect x="364" y="242" width="34" height="30" rx="4" fill="#166534" stroke="#22c55e" stroke-width="1.2"/>
      <text x="381" y="262" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" text-anchor="middle">2L</text>
    </g>

    <!-- Secret Power Cells (#0e7490 cyan background, #22d3ee border, cyan star) -->
    <g class="anim-power-cell">
      <rect x="136" y="175" width="34" height="29" rx="4" fill="#0e7490" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="153" y="195" fill="#e0f2fe" font-size="16" text-anchor="middle">★</text>

      <rect x="440" y="175" width="34" height="29" rx="4" fill="#0e7490" stroke="#22d3ee" stroke-width="1.5"/>
      <text x="457" y="195" fill="#e0f2fe" font-size="16" text-anchor="middle">★</text>
    </g>

    <!-- Center Star Cell (#1e1b4b indigo, #fbbf24 amber border, gold star) -->
    <g class="anim-star-center">
      <rect x="288" y="174" width="34" height="31" rx="5" fill="#1e1b4b" stroke="#fbbf24" stroke-width="1.8"/>
      <text x="305" y="196" fill="#fbbf24" font-size="18" text-anchor="middle">★</text>
    </g>

    <!-- ==================== AUTHENTIC IN-GAME WOODEN PLAYED TILES ==================== -->
    <!-- Horizontal Word: "BATTLE" crossing through the center star area -->
    <!-- Tile 1: B (Point 3) -->
    <g transform="translate(174, 174)" filter="url(#tileShadow)">
      <rect width="34" height="31" rx="4" fill="url(#woodTileFace)" stroke="#fef08a" stroke-width="1"/>
      <rect width="34" height="15" rx="4" fill="url(#tileGloss)"/>
      <text x="14" y="21" fill="#ffffff" font-family="'Inter', sans-serif" font-size="14" font-weight="900" text-anchor="middle">B</text>
      <text x="29" y="27" fill="#ffffff" font-family="'Inter', sans-serif" font-size="8.5" font-weight="900" text-anchor="end">3</text>
    </g>

    <!-- Tile 2: A (Point 1) -->
    <g transform="translate(212, 174)" filter="url(#tileShadow)">
      <rect width="34" height="31" rx="4" fill="url(#woodTileFace)" stroke="#fef08a" stroke-width="1"/>
      <rect width="34" height="15" rx="4" fill="url(#tileGloss)"/>
      <text x="14" y="21" fill="#ffffff" font-family="'Inter', sans-serif" font-size="14" font-weight="900" text-anchor="middle">A</text>
      <text x="29" y="27" fill="#ffffff" font-family="'Inter', sans-serif" font-size="8.5" font-weight="900" text-anchor="end">1</text>
    </g>

    <!-- Tile 3: T (Point 1) -->
    <g transform="translate(250, 174)" filter="url(#tileShadow)">
      <rect width="34" height="31" rx="4" fill="url(#woodTileFace)" stroke="#fef08a" stroke-width="1"/>
      <rect width="34" height="15" rx="4" fill="url(#tileGloss)"/>
      <text x="14" y="21" fill="#ffffff" font-family="'Inter', sans-serif" font-size="14" font-weight="900" text-anchor="middle">T</text>
      <text x="29" y="27" fill="#ffffff" font-family="'Inter', sans-serif" font-size="8.5" font-weight="900" text-anchor="end">1</text>
    </g>

    <!-- Tile 4: T (Point 1 - on Center Star) -->
    <g transform="translate(288, 174)" filter="url(#tileShadow)">
      <rect width="34" height="31" rx="4" fill="url(#woodTileFace)" stroke="#fef08a" stroke-width="1.2"/>
      <rect width="34" height="15" rx="4" fill="url(#tileGloss)"/>
      <text x="14" y="21" fill="#ffffff" font-family="'Inter', sans-serif" font-size="14" font-weight="900" text-anchor="middle">T</text>
      <text x="29" y="27" fill="#ffffff" font-family="'Inter', sans-serif" font-size="8.5" font-weight="900" text-anchor="end">1</text>
    </g>

    <!-- Tile 5: L (Point 1) -->
    <g transform="translate(326, 174)" filter="url(#tileShadow)">
      <rect width="34" height="31" rx="4" fill="url(#woodTileFace)" stroke="#fef08a" stroke-width="1"/>
      <rect width="34" height="15" rx="4" fill="url(#tileGloss)"/>
      <text x="14" y="21" fill="#ffffff" font-family="'Inter', sans-serif" font-size="14" font-weight="900" text-anchor="middle">L</text>
      <text x="29" y="27" fill="#ffffff" font-family="'Inter', sans-serif" font-size="8.5" font-weight="900" text-anchor="end">1</text>
    </g>

    <!-- Tile 6: E (Point 1) -->
    <g transform="translate(364, 174)" filter="url(#tileShadow)">
      <rect width="34" height="31" rx="4" fill="url(#woodTileFace)" stroke="#fef08a" stroke-width="1"/>
      <rect width="34" height="15" rx="4" fill="url(#tileGloss)"/>
      <text x="14" y="21" fill="#ffffff" font-family="'Inter', sans-serif" font-size="14" font-weight="900" text-anchor="middle">E</text>
      <text x="29" y="27" fill="#ffffff" font-family="'Inter', sans-serif" font-size="8.5" font-weight="900" text-anchor="end">1</text>
    </g>

    <!-- Vertical Word: "WORD" connecting through O -->
    <!-- W (Point 4) -->
    <g transform="translate(212, 141)" filter="url(#tileShadow)">
      <rect width="34" height="31" rx="4" fill="url(#woodTileFace)" stroke="#fef08a" stroke-width="1"/>
      <rect width="34" height="15" rx="4" fill="url(#tileGloss)"/>
      <text x="14" y="21" fill="#ffffff" font-family="'Inter', sans-serif" font-size="13" font-weight="900" text-anchor="middle">W</text>
      <text x="29" y="27" fill="#ffffff" font-family="'Inter', sans-serif" font-size="8.5" font-weight="900" text-anchor="end">4</text>
    </g>
    <!-- R (Point 1) -->
    <g transform="translate(212, 208)" filter="url(#tileShadow)">
      <rect width="34" height="31" rx="4" fill="url(#woodTileFace)" stroke="#fef08a" stroke-width="1"/>
      <rect width="34" height="15" rx="4" fill="url(#tileGloss)"/>
      <text x="14" y="21" fill="#ffffff" font-family="'Inter', sans-serif" font-size="14" font-weight="900" text-anchor="middle">R</text>
      <text x="29" y="27" fill="#ffffff" font-family="'Inter', sans-serif" font-size="8.5" font-weight="900" text-anchor="end">1</text>
    </g>
    <!-- D (Point 2) -->
    <g transform="translate(212, 242)" filter="url(#tileShadow)">
      <rect width="34" height="31" rx="4" fill="url(#woodTileFace)" stroke="#fef08a" stroke-width="1"/>
      <rect width="34" height="15" rx="4" fill="url(#tileGloss)"/>
      <text x="14" y="21" fill="#ffffff" font-family="'Inter', sans-serif" font-size="14" font-weight="900" text-anchor="middle">D</text>
      <text x="29" y="27" fill="#ffffff" font-family="'Inter', sans-serif" font-size="8.5" font-weight="900" text-anchor="end">2</text>
    </g>

    <!-- Center Coordinate Marker Tag -->
    <rect x="238" y="215" width="134" height="18" rx="9" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="305" y="228" fill="#fde68a" font-family="'Inter', sans-serif" font-size="8.5" font-weight="900" text-anchor="middle">
      ★ CENTER (ROW 9, COL 13)
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- RIGHT: 4 IN-GAME MULTIPLIER & TILE SPECIFICATION CARDS                   -->
  <!-- ========================================================================= -->
  <g transform="translate(670, 20)">
    
    <!-- CARD 1: TRIPLE LETTER (3L FIRE) -->
    <g transform="translate(0, 0)" filter="url(#cardShadow)">
      <rect width="495" height="80" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="1.3"/>
      <!-- In-game 3L cell replica badge -->
      <rect x="15" y="17" width="46" height="46" rx="6" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
      <rect x="18" y="20" width="40" height="40" rx="4" fill="#ef4444" fill-opacity="0.25"/>
      <text x="38" y="46" fill="#ffffff" font-family="'Inter', sans-serif" font-size="17" font-weight="900" text-anchor="middle">3L</text>
      
      <text x="74" y="34" fill="#f87171" font-family="'Inter', sans-serif" font-size="13.5" font-weight="900">TRIPLE LETTER (3× MULTIPLIER)</text>
      <text x="74" y="54" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11.5">
        Triples the newly placed tile point value across all formed words.
      </text>
    </g>

    <!-- CARD 2: DOUBLE LETTER (2L EARTH) -->
    <g transform="translate(0, 90)" filter="url(#cardShadow)">
      <rect width="495" height="80" rx="10" fill="#0f172a" stroke="#22c55e" stroke-width="1.3"/>
      <!-- In-game 2L cell replica badge -->
      <rect x="15" y="17" width="46" height="46" rx="6" fill="#166534" stroke="#22c55e" stroke-width="1.5"/>
      <rect x="18" y="20" width="40" height="40" rx="4" fill="#22c55e" fill-opacity="0.25"/>
      <text x="38" y="46" fill="#ffffff" font-family="'Inter', sans-serif" font-size="17" font-weight="900" text-anchor="middle">2L</text>
      
      <text x="74" y="34" fill="#4ade80" font-family="'Inter', sans-serif" font-size="13.5" font-weight="900">DOUBLE LETTER (2× MULTIPLIER)</text>
      <text x="74" y="54" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11.5">
        Doubles the letter value for newly placed tiles on that coordinate.
      </text>
    </g>

    <!-- CARD 3: SECRET POWER SQUARE (LIGHTNING) -->
    <g transform="translate(0, 180)" filter="url(#cardShadow)">
      <rect width="495" height="80" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="1.3"/>
      <!-- In-game Power cell replica badge -->
      <rect x="15" y="17" width="46" height="46" rx="6" fill="#0e7490" stroke="#22d3ee" stroke-width="1.5"/>
      <rect x="18" y="20" width="40" height="40" rx="4" fill="#22d3ee" fill-opacity="0.25"/>
      <text x="38" y="48" fill="#e0f2fe" font-size="24" text-anchor="middle">★</text>
      
      <text x="74" y="34" fill="#22d3ee" font-family="'Inter', sans-serif" font-size="13.5" font-weight="900">SECRET POWER SQUARE</text>
      <text x="74" y="54" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11.5">
        Awards a random tactical power card to hand (maximum 3 cards held).
      </text>
    </g>

    <!-- CARD 4: ALL-TILES BINGO BONUS (+50) -->
    <g transform="translate(0, 270)" filter="url(#cardShadow)">
      <rect width="495" height="80" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.3"/>
      <!-- Authentic 3D Wood Tile replica badge -->
      <g transform="translate(15, 17)" filter="url(#tileShadow)">
        <rect width="46" height="46" rx="6" fill="url(#woodTileFace)" stroke="#fef08a" stroke-width="1.5"/>
        <rect width="46" height="22" rx="6" fill="url(#tileGloss)"/>
        <text x="23" y="30" fill="#ffffff" font-family="'Inter', sans-serif" font-size="15" font-weight="900" text-anchor="middle">+50</text>
      </g>
      
      <text x="74" y="34" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="13.5" font-weight="900">ALL-TILES BINGO BONUS (+50 PTS)</text>
      <text x="74" y="54" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11.5">
        Placing all 7 rack tiles in 1 turn awards +50 bonus pts &amp; screen shockwave.
      </text>
    </g>

  </g>
</svg>
