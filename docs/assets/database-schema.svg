<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
 <defs>
 <radialGradient id="dbBg" cx="50%" cy="50%" r="70%">
 <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
 <stop offset="60%" stop-color="#090d16" stop-opacity="0.98"/>
 <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
 </radialGradient>

 <!-- Table Shadow -->
 <filter id="tableShadow" x="-10%" y="-10%" width="120%" height="120%">
 <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.55"/>
 </filter>

 <style>
 @keyframes slowPipeGlow {
 0%, 100% { stroke-opacity: 0.35; }
 50% { stroke-opacity: 0.95; }
 }
 .db-pipe { stroke-dasharray: 4 4; animation: slowPipeGlow 4s ease-in-out infinite; }
 </style>
 </defs>

 <rect width="1200" height="680" fill="url(#dbBg)" rx="16"/>

 <!-- Title -->
 <g transform="translate(600, 36)">
 <text x="0" y="0" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="4">
 RELATIONAL DATA ARCHITECTURE
 </text>
 <text x="0" y="24" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="20" font-weight="900" text-anchor="middle">
 SQLAlchemy Async Database Entity-Relationship Model
 </text>
 </g>

 <!-- Relational Connection Paths Behind Tables -->
 <g stroke="#475569" stroke-width="1.5" fill="none" opacity="0.6">
 <!-- GameRoom -> Game -->
 <path d="M 230 180 L 330 180" class="db-pipe" stroke="#38bdf8"/>
 <!-- Game -> GamePlayer -->
 <path d="M 450 300 L 450 360 L 230 360 L 230 400" class="db-pipe" stroke="#10b981"/>
 <!-- GamePlayer -> PlayerCard -->
 <path d="M 230 600 L 230 630 L 450 630 L 450 400" class="db-pipe" stroke="#8b5cf6"/>
 <!-- Game -> Move -->
 <path d="M 490 300 L 490 400" class="db-pipe" stroke="#c084fc"/>
 <!-- Game -> BoardCell -->
 <path d="M 570 300 L 570 360 L 730 360 L 730 400" class="db-pipe" stroke="#38bdf8"/>
 <!-- Game -> GameTile -->
 <path d="M 590 280 L 750 280 L 750 180 L 770 180" class="db-pipe" stroke="#f43f5e"/>
 <!-- DictionaryWord -> WordDefinition -->
 <path d="M 970 300 L 970 400" class="db-pipe" stroke="#14b8a6"/>
 </g>

 <!-- ==================== TABLE 1: GAMEROOM (TOP LEFT) ==================== -->
 <g transform="translate(30, 80)" filter="url(#tableShadow)">
 <rect width="210" height="230" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
 <rect width="210" height="32" rx="10" fill="#0369a1" fill-opacity="0.4"/>
 <text x="15" y="21" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="12" font-weight="900">GameRoom</text>

 <g transform="translate(15, 50)" font-family="'Inter', monospace" font-size="10" fill="#cbd5e1">
 <text y="0"><tspan fill="#f59e0b" font-weight="800">PK</tspan> id: String</text>
 <text y="18"><tspan fill="#38bdf8" font-weight="800">UQ</tspan> game_pin: String</text>
 <text y="36">host_player_id: String</text>
 <text y="54">game_mode: String (HP|TURNS)</text>
 <text y="72">status: String (WAITING)</text>
 <text y="90">max_players: Integer</text>
 <text y="108">starting_hp: Integer</text>
 <text y="126">turn_timer_seconds: Int</text>
 <text y="144">is_debug: Boolean</text>
 <text y="162">created_at: DateTime</text>
 </g>
 </g>

 <!-- ==================== TABLE 2: GAME (TOP MID - MASTER) ==================== -->
 <g transform="translate(330, 80)" filter="url(#tableShadow)">
 <rect width="360" height="230" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.8"/>
 <rect width="360" height="32" rx="10" fill="#78350f" fill-opacity="0.4"/>
 <text x="15" y="21" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="12" font-weight="900">Game (Active Match Lifecycle)</text>

 <g transform="translate(15, 50)" font-family="'Inter', monospace" font-size="10" fill="#cbd5e1">
 <text y="0"><tspan fill="#f59e0b" font-weight="800">PK</tspan> id: String</text>
 <text y="18"><tspan fill="#60a5fa" font-weight="800">FK</tspan> room_id: String → GameRoom.id</text>
 <text y="36">status: String (PLAYING | FINISHED)</text>
 <text y="54">turn_number: Integer</text>
 <text y="72">current_player_id: String</text>
 <text y="90">board_state: JSON (sparse "{row}_{col}")</text>
 <text y="108">tile_bag: JSON • tile_bag_counts: JSON</text>
 <text y="126">consecutive_passes: Integer</text>
 <text y="144">pending_effect: JSON (1.0s shield window)</text>
 <text y="162">winner_player_id: String • win_reason: Str</text>
 </g>
 </g>

 <!-- ==================== TABLE 3: GAMETILE (TOP RIGHT) ==================== -->
 <g transform="translate(770, 80)" filter="url(#tableShadow)">
 <rect width="180" height="210" rx="10" fill="#0f172a" stroke="#f43f5e" stroke-width="1.5"/>
 <rect width="180" height="32" rx="10" fill="#881337" fill-opacity="0.4"/>
 <text x="15" y="21" fill="#fb7185" font-family="'Inter', sans-serif" font-size="12" font-weight="900">GameTile</text>

 <g transform="translate(15, 50)" font-family="'Inter', monospace" font-size="10" fill="#cbd5e1">
 <text y="0"><tspan fill="#f59e0b" font-weight="800">PK</tspan> id: String</text>
 <text y="18"><tspan fill="#60a5fa" font-weight="800">FK</tspan> game_id: String</text>
 <text y="36">tile_id: String</text>
 <text y="54">letter: String</text>
 <text y="72">value: Integer</text>
 <text y="90">is_blank: Boolean</text>
 <text y="108">is_drawn: Boolean</text>
 <text y="126">current_holder_id: Str</text>
 </g>
 </g>

 <!-- ==================== TABLE 4: DICTIONARY WORD (TOP FAR RIGHT) ==================== -->
 <g transform="translate(970, 80)" filter="url(#tableShadow)">
 <rect width="200" height="210" rx="10" fill="#0f172a" stroke="#14b8a6" stroke-width="1.5"/>
 <rect width="200" height="32" rx="10" fill="#0f766e" fill-opacity="0.4"/>
 <text x="15" y="21" fill="#5eead4" font-family="'Inter', sans-serif" font-size="12" font-weight="900">DictionaryWord</text>

 <g transform="translate(15, 50)" font-family="'Inter', monospace" font-size="10" fill="#cbd5e1">
 <text y="0"><tspan fill="#f59e0b" font-weight="800">PK</tspan> id: Integer</text>
 <text y="18"><tspan fill="#38bdf8" font-weight="800">UQ</tspan> word: String</text>
 <text y="36">is_valid: Boolean</text>
 <text y="54">length: Integer</text>
 <text y="72">definition: Text</text>
 <text y="90">created_at: DateTime</text>
 </g>
 </g>

 <!-- ==================== TABLE 5: GAMEPLAYER (BOTTOM ROW 1) ==================== -->
 <g transform="translate(30, 390)" filter="url(#tableShadow)">
 <rect width="250" height="250" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
 <rect width="250" height="32" rx="10" fill="#064e3b" fill-opacity="0.4"/>
 <text x="15" y="21" fill="#34d399" font-family="'Inter', sans-serif" font-size="12" font-weight="900">GamePlayer</text>

 <g transform="translate(15, 50)" font-family="'Inter', monospace" font-size="10" fill="#cbd5e1">
 <text y="0"><tspan fill="#f59e0b" font-weight="800">PK</tspan> id: String</text>
 <text y="18"><tspan fill="#60a5fa" font-weight="800">FK</tspan> game_id: String</text>
 <text y="36">display_name: String</text>
 <text y="54">score: Integer • hp: Integer</text>
 <text y="72">rack: JSON (active 7 tiles)</text>
 <text y="90">cards: JSON (held power cards)</text>
 <text y="108">is_host: Bool • is_ready: Bool</text>
 <text y="126">connection_status: String</text>
 <text y="144"><tspan fill="#38bdf8" font-weight="800">UQ</tspan> session_token: String</text>
 <text y="162">has_shield: Boolean</text>
 </g>
 </g>

 <!-- ==================== TABLE 6: MOVE (BOTTOM ROW 2) ==================== -->
 <g transform="translate(300, 390)" filter="url(#tableShadow)">
 <rect width="260" height="250" rx="10" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5"/>
 <rect width="260" height="32" rx="10" fill="#4c1d95" fill-opacity="0.4"/>
 <text x="15" y="21" fill="#c084fc" font-family="'Inter', sans-serif" font-size="12" font-weight="900">Move (Recorded Actions)</text>

 <g transform="translate(15, 50)" font-family="'Inter', monospace" font-size="10" fill="#cbd5e1">
 <text y="0"><tspan fill="#f59e0b" font-weight="800">PK</tspan> id: String</text>
 <text y="18"><tspan fill="#60a5fa" font-weight="800">FK</tspan> game_id: String</text>
 <text y="36"><tspan fill="#60a5fa" font-weight="800">FK</tspan> player_id: String</text>
 <text y="54">turn_number: Integer</text>
 <text y="72">move_type: PLACE | PASS | SWAP</text>
 <text y="90">placed_tiles: JSON</text>
 <text y="108">words_formed: JSON</text>
 <text y="126">score: Integer • hp_damage: Int</text>
 <text y="144">cards_awarded: JSON</text>
 <text y="162">created_at: DateTime</text>
 </g>
 </g>

 <!-- ==================== TABLE 7: BOARDCELL (BOTTOM ROW 3) ==================== -->
 <g transform="translate(580, 390)" filter="url(#tableShadow)">
 <rect width="240" height="250" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
 <rect width="240" height="32" rx="10" fill="#0369a1" fill-opacity="0.4"/>
 <text x="15" y="21" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="12" font-weight="900">BoardCell</text>

 <g transform="translate(15, 50)" font-family="'Inter', monospace" font-size="10" fill="#cbd5e1">
 <text y="0"><tspan fill="#f59e0b" font-weight="800">PK</tspan> id: String</text>
 <text y="18"><tspan fill="#60a5fa" font-weight="800">FK</tspan> game_id: String</text>
 <text y="36">row: Integer • col: Integer</text>
 <text y="54">letter: String • value: Int</text>
 <text y="72">owner_player_id: String</text>
 <text y="90">placed_turn: Integer</text>
 <text y="108">is_blank: Boolean</text>
 <text y="126">multiplier: String (3L|2L|★)</text>
 <text y="144">created_at: DateTime</text>
 </g>
 </g>

 <!-- ==================== TABLE 8: WORDDEFINITION (BOTTOM ROW 4) ==================== -->
 <g transform="translate(840, 390)" filter="url(#tableShadow)">
 <rect width="330" height="250" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
 <rect width="330" height="32" rx="10" fill="#064e3b" fill-opacity="0.4"/>
 <text x="15" y="21" fill="#34d399" font-family="'Inter', sans-serif" font-size="12" font-weight="900">WordDefinition (Lexicon)</text>

 <g transform="translate(15, 50)" font-family="'Inter', monospace" font-size="10" fill="#cbd5e1">
 <text y="0"><tspan fill="#f59e0b" font-weight="800">PK</tspan> id: Integer</text>
 <text y="18"><tspan fill="#60a5fa" font-weight="800">FK</tspan> word: String → DictionaryWord</text>
 <text y="36">part_of_speech: String</text>
 <text y="54">definition: Text</text>
 <text y="72">phonetics: String (IPA)</text>
 <text y="90">audio_url: String</text>
 <text y="108">source_tier: L1_RAM | L2_DB | L3_API</text>
 <text y="126">created_at: DateTime</text>
 </g>
 </g>
</svg>
