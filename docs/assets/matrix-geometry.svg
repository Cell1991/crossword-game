<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="matrixBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#090d16" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>

    <!-- In-Game Authentic Wood Tile Linear Gradient -->
    <linearGradient id="woodTileGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="28%" stop-color="#f59e0b"/>
      <stop offset="65%" stop-color="#d97706"/>
      <stop offset="88%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Tile Top Gloss Highlight -->
    <linearGradient id="tileGlossHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Star Glow & Drop Shadow Filters -->
    <filter id="matrixShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="tileDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <style>
      @keyframes slowGlowCenter {
        0%, 100% { stroke-opacity: 0.4; stroke-width: 1.5; filter: drop-shadow(0 0 4px #fbbf24); }
        50% { stroke-opacity: 1.0; stroke-width: 2.5; filter: drop-shadow(0 0 10px #f59e0b); }
      }
      .anim-star-center { animation: slowGlowCenter 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="460" fill="url(#matrixBg)" rx="16"/>

  <!-- Top Title / HUD Header -->
  <g transform="translate(600, 24)">
    <text x="0" y="0" fill="#64748b" font-family="'Inter', sans-serif" font-size="10.5" font-weight="900" text-anchor="middle" letter-spacing="4">
      MODULAR GRID TOPOLOGY &amp; CELL MULTIPLIER SPECIFICATION
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- LEFT: 19x27 BOARD BLUEPRINT WITH IN-GAME CANVAS CELLS & WOOD TILES        -->
  <!-- ========================================================================= -->
  <g transform="translate(30, 44)" filter="url(#matrixShadow)">
    <rect width="660" height="390" rx="14" fill="#090d16" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Grid Header Bar -->
    <rect x="0" y="0" width="660" height="34" rx="14" fill="#0f172a" fill-opacity="0.85"/>
    <text x="20" y="22" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="11" font-weight="900" letter-spacing="1">
      19 ROWS × 27 COLUMNS (513 CELLS)
    </text>
    <text x="640" y="22" fill="#94a3b8" font-family="'Inter', monospace" font-size="10" font-weight="700" text-anchor="end">
      COLS: 0 &bull; 13 (CENTER) &bull; 26
    </text>

    <!-- Blueprint Board Outer Frame -->
    <rect x="20" y="46" width="620" height="324" rx="8" fill="#030712" stroke="#334155" stroke-width="1"/>

    <!-- Golden Grid Mesh lines (In-Game look: rgba(245, 190, 72, 0.20)) -->
    <g stroke="rgba(245, 190, 72, 0.18)" stroke-width="0.8">
      <!-- Horizontal row lines -->
      <line x1="20" y1="82" x2="640" y2="82"/>
      <line x1="20" y1="118" x2="640" y2="118"/>
      <line x1="20" y1="154" x2="640" y2="154"/>
      <line x1="20" y1="190" x2="640" y2="190"/>
      <line x1="20" y1="226" x2="640" y2="226"/>
      <line x1="20" y1="262" x2="640" y2="262"/>
      <line x1="20" y1="298" x2="640" y2="298"/>
      <line x1="20" y1="334" x2="640" y2="334"/>

      <!-- Vertical col lines -->
      <line x1="68" y1="46" x2="68" y2="370"/>
      <line x1="115" y1="46" x2="115" y2="370"/>
      <line x1="163" y1="46" x2="163" y2="370"/>
      <line x1="211" y1="46" x2="211" y2="370"/>
      <line x1="258" y1="46" x2="258" y2="370"/>
      <line x1="306" y1="46" x2="306" y2="370"/>
      <line x1="354" y1="46" x2="354" y2="370"/>
      <line x1="401" y1="46" x2="401" y2="370"/>
      <line x1="449" y1="46" x2="449" y2="370"/>
      <line x1="497" y1="46" x2="497" y2="370"/>
      <line x1="544" y1="46" x2="544" y2="370"/>
      <line x1="592" y1="46" x2="592" y2="370"/>
    </g>

    <!-- Row Coordinate Labels -->
    <g font-family="'Inter', monospace" font-size="10.5" fill="#64748b" text-anchor="middle">
      <text x="38" y="68">R0</text>
      <text x="38" y="140">R4</text>
      <text x="38" y="212">R9</text>
      <text x="38" y="284">R14</text>
      <text x="38" y="356">R18</text>
    </g>

    <!-- ==================== SPECIAL IN-GAME MULTIPLIER CELLS ==================== -->
    <!-- 3L Fire Cells (#7f1d1d crimson, #ef4444 border, white 3L) -->
    <g>
      <rect x="315" y="52" width="30" height="26" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.2"/>
      <text x="330" y="70" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" text-anchor="middle">3L</text>

      <rect x="315" y="338" width="30" height="26" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.2"/>
      <text x="330" y="356" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" text-anchor="middle">3L</text>

      <rect x="74" y="88" width="30" height="26" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.2"/>
      <text x="89" y="106" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" text-anchor="middle">3L</text>

      <rect x="556" y="88" width="30" height="26" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.2"/>
      <text x="571" y="106" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" text-anchor="middle">3L</text>

      <rect x="74" y="302" width="30" height="26" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.2"/>
      <text x="89" y="320" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" text-anchor="middle">3L</text>

      <rect x="556" y="302" width="30" height="26" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.2"/>
      <text x="571" y="320" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" text-anchor="middle">3L</text>

      <rect x="250" y="196" width="30" height="26" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.2"/>
      <text x="265" y="214" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" text-anchor="middle">3L</text>

      <rect x="380" y="196" width="30" height="26" rx="4" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.2"/>
      <text x="395" y="214" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" text-anchor="middle">3L</text>
    </g>

    <!-- 2L Earth Cells (#166534 green, #22c55e border, white 2L) -->
    <g>
      <rect x="218" y="124" width="30" height="26" rx="4" fill="#166534" stroke="#22c55e" stroke-width="1.2"/>
      <text x="233" y="142" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" text-anchor="middle">2L</text>

      <rect x="412" y="124" width="30" height="26" rx="4" fill="#166534" stroke="#22c55e" stroke-width="1.2"/>
      <text x="427" y="142" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" text-anchor="middle">2L</text>

      <rect x="218" y="268" width="30" height="26" rx="4" fill="#166534" stroke="#22c55e" stroke-width="1.2"/>
      <text x="233" y="286" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" text-anchor="middle">2L</text>

      <rect x="412" y="268" width="30" height="26" rx="4" fill="#166534" stroke="#22c55e" stroke-width="1.2"/>
      <text x="427" y="286" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" text-anchor="middle">2L</text>
    </g>

    <!-- Secret Power Cells (#0e7490 cyan, #22d3ee border, cyan star) -->
    <g>
      <rect x="122" y="52" width="30" height="26" rx="4" fill="#0e7490" stroke="#22d3ee" stroke-width="1.2"/>
      <text x="137" y="71" fill="#e0f2fe" font-size="16" text-anchor="middle">★</text>

      <rect x="508" y="52" width="30" height="26" rx="4" fill="#0e7490" stroke="#22d3ee" stroke-width="1.2"/>
      <text x="523" y="71" fill="#e0f2fe" font-size="16" text-anchor="middle">★</text>

      <rect x="122" y="338" width="30" height="26" rx="4" fill="#0e7490" stroke="#22d3ee" stroke-width="1.2"/>
      <text x="137" y="357" fill="#e0f2fe" font-size="16" text-anchor="middle">★</text>

      <rect x="508" y="338" width="30" height="26" rx="4" fill="#0e7490" stroke="#22d3ee" stroke-width="1.2"/>
      <text x="523" y="357" fill="#e0f2fe" font-size="16" text-anchor="middle">★</text>
    </g>

    <!-- Center Star Cell (Row 9, Col 13) -->
    <g class="anim-star-center">
      <rect x="314" y="194" width="32" height="30" rx="6" fill="#1e1b4b" stroke="#fbbf24" stroke-width="2"/>
      <text x="330" y="216" fill="#fbbf24" font-size="18" text-anchor="middle">★</text>
    </g>

    <!-- Center Star Coordinate Tag -->
    <rect x="236" y="235" width="188" height="18" rx="9" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="330" y="247" fill="#fde68a" font-family="'Inter', sans-serif" font-size="9" font-weight="900" text-anchor="middle">
      ★ CENTER STAR (ROW 9, COL 13)
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- RIGHT: 4 MULTIPLIER SPEC CARDS MATCHING IN-GAME THEME                    -->
  <!-- ========================================================================= -->
  <g transform="translate(710, 44)">

    <!-- CARD 1: CENTER STAR -->
    <g transform="translate(0, 0)" filter="url(#matrixShadow)">
      <rect width="460" height="88" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.4"/>
      <!-- Center Star replica badge -->
      <rect x="14" y="18" width="50" height="52" rx="8" fill="#1e1b4b" stroke="#fbbf24" stroke-width="1.8"/>
      <text x="39" y="52" fill="#fbbf24" font-size="26" text-anchor="middle">★</text>
      
      <text x="76" y="33" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="13" font-weight="900">★ CENTER STAR (9, 13)</text>
      <text x="76" y="52" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600">
        Mandatory Opening Move Anchor
      </text>
      <text x="76" y="70" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11.5">
        First word of the match must cover this coordinate.
      </text>
    </g>

    <!-- CARD 2: TRIPLE LETTER (3L FIRE) -->
    <g transform="translate(0, 100)" filter="url(#matrixShadow)">
      <rect width="460" height="88" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="1.3"/>
      <!-- In-game 3L Fire replica badge -->
      <rect x="14" y="18" width="50" height="52" rx="8" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.6"/>
      <rect x="17" y="21" width="44" height="46" rx="6" fill="#ef4444" fill-opacity="0.25"/>
      <text x="39" y="51" fill="#ffffff" font-family="'Inter', sans-serif" font-size="19" font-weight="900" text-anchor="middle">3L</text>
      
      <text x="76" y="33" fill="#f87171" font-family="'Inter', sans-serif" font-size="13" font-weight="900">TRIPLE LETTER (3× MULTIPLIER)</text>
      <text x="76" y="52" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600">
        Triples newly placed tile point value
      </text>
      <text x="76" y="70" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11.5">
        Applies across all newly formed intersecting words.
      </text>
    </g>

    <!-- CARD 3: DOUBLE LETTER (2L EARTH) -->
    <g transform="translate(0, 200)" filter="url(#matrixShadow)">
      <rect width="460" height="88" rx="10" fill="#0f172a" stroke="#22c55e" stroke-width="1.3"/>
      <!-- In-game 2L Earth replica badge -->
      <rect x="14" y="18" width="50" height="52" rx="8" fill="#166534" stroke="#22c55e" stroke-width="1.6"/>
      <rect x="17" y="21" width="44" height="46" rx="6" fill="#22c55e" fill-opacity="0.25"/>
      <text x="39" y="51" fill="#ffffff" font-family="'Inter', sans-serif" font-size="19" font-weight="900" text-anchor="middle">2L</text>
      
      <text x="76" y="33" fill="#4ade80" font-family="'Inter', sans-serif" font-size="13" font-weight="900">DOUBLE LETTER (2× MULTIPLIER)</text>
      <text x="76" y="52" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600">
        Doubles newly placed letter value
      </text>
      <text x="76" y="70" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11.5">
        Strategic stepping stone for high-yield combos.
      </text>
    </g>

    <!-- CARD 4: SECRET POWER & BINGO -->
    <g transform="translate(0, 300)" filter="url(#matrixShadow)">
      <rect width="460" height="92" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="1.3"/>
      <!-- In-game Power cell replica badge -->
      <rect x="14" y="20" width="50" height="52" rx="8" fill="#0e7490" stroke="#22d3ee" stroke-width="1.6"/>
      <rect x="17" y="23" width="44" height="46" rx="6" fill="#22d3ee" fill-opacity="0.25"/>
      <text x="39" y="55" fill="#e0f2fe" font-size="26" text-anchor="middle">★</text>
      
      <text x="76" y="34" fill="#22d3ee" font-family="'Inter', sans-serif" font-size="13" font-weight="900">★ POWER CELL &amp; +50 BINGO</text>
      <text x="76" y="53" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600">
        Power Cards Drop &amp; All-7-Tiles Bonus
      </text>
      <text x="76" y="71" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11.5">
        Power cell awards tactical card. 7-tile bingo yields +50 pts!
      </text>
    </g>
  </g>
</svg>
