<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="matrixBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0b132b" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#070c1d" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>

    <!-- In-Game 3L Fire Cell Gradient (Glossy Red) -->
    <linearGradient id="cell3LGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="45%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>

    <!-- In-Game 2L Earth Cell Gradient (Glossy Green) -->
    <linearGradient id="cell2LGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="45%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>

    <!-- In-Game Power Cell Gradient (Cyan Gem) -->
    <linearGradient id="cellPowerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>

    <!-- In-Game Wood Tile Face Gradient (Amber / Gold Wood) -->
    <linearGradient id="woodTileGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="65%" stop-color="#d97706"/>
      <stop offset="90%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Top Gloss Highlight -->
    <linearGradient id="glossReflection" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadow Filters -->
    <filter id="matrixShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <style>
      @keyframes slowGlowCenter {
        0%, 100% { filter: drop-shadow(0 0 3px #fbbf24); }
        50% { filter: drop-shadow(0 0 9px #f59e0b); }
      }
      @keyframes slowGlowPower {
        0%, 100% { opacity: 0.88; filter: drop-shadow(0 0 3px #22d3ee); }
        50% { opacity: 1.0; filter: drop-shadow(0 0 8px #38bdf8); }
      }
      .anim-star-center { animation: slowGlowCenter 4s ease-in-out infinite; }
      .anim-power-glow { animation: slowGlowPower 3.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="460" fill="url(#matrixBg)" rx="16"/>

  <!-- Top Title / HUD Header -->
  <g transform="translate(600, 24)">
    <text x="0" y="0" fill="#64748b" font-family="'Inter', sans-serif" font-size="10.5" font-weight="900" text-anchor="middle" letter-spacing="4">
      MODULAR GRID TOPOLOGY &amp; CELL MULTIPLIER SPECIFICATION
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- LEFT: 19x27 BOARD BLUEPRINT WITH AUTHENTIC GAME CELLS (MATCHING SCREENSHOT)-->
  <!-- ========================================================================= -->
  <g transform="translate(30, 44)" filter="url(#matrixShadow)">
    <rect width="660" height="390" rx="14" fill="#070c1d" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Grid Header Bar -->
    <rect x="0" y="0" width="660" height="34" rx="14" fill="#0f172a" fill-opacity="0.85"/>
    <text x="20" y="22" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="11" font-weight="900" letter-spacing="1">
      19 ROWS × 27 COLUMNS (513 CELLS)
    </text>
    <text x="640" y="22" fill="#94a3b8" font-family="'Inter', monospace" font-size="10" font-weight="700" text-anchor="end">
      COLS: 0 • 13 (CENTER) • 26
    </text>

    <!-- Blueprint Board Outer Frame -->
    <rect x="20" y="46" width="620" height="324" rx="8" fill="#080e22" stroke="#1e293b" stroke-width="1"/>

    <!-- Golden Grid Mesh lines (In-Game look: rgba(245, 190, 72, 0.18)) -->
    <g stroke="rgba(245, 190, 72, 0.18)" stroke-width="0.8">
      <!-- Horizontal row lines -->
      <line x1="20" y1="82" x2="640" y2="82"/>
      <line x1="20" y1="118" x2="640" y2="118"/>
      <line x1="20" y1="154" x2="640" y2="154"/>
      <line x1="20" y1="190" x2="640" y2="190"/>
      <line x1="20" y1="226" x2="640" y2="226"/>
      <line x1="20" y1="262" x2="640" y2="262"/>
      <line x1="20" y1="298" x2="640" y2="298"/>
      <line x1="20" y1="334" x2="640" y2="334"/>

      <!-- Vertical col lines -->
      <line x1="68" y1="46" x2="68" y2="370"/>
      <line x1="115" y1="46" x2="115" y2="370"/>
      <line x1="163" y1="46" x2="163" y2="370"/>
      <line x1="211" y1="46" x2="211" y2="370"/>
      <line x1="258" y1="46" x2="258" y2="370"/>
      <line x1="306" y1="46" x2="306" y2="370"/>
      <line x1="354" y1="46" x2="354" y2="370"/>
      <line x1="401" y1="46" x2="401" y2="370"/>
      <line x1="449" y1="46" x2="449" y2="370"/>
      <line x1="497" y1="46" x2="497" y2="370"/>
      <line x1="544" y1="46" x2="544" y2="370"/>
      <line x1="592" y1="46" x2="592" y2="370"/>
    </g>

    <!-- Row Coordinate Labels -->
    <g font-family="'Inter', monospace" font-size="10.5" fill="#64748b" text-anchor="middle">
      <text x="38" y="68">R0</text>
      <text x="38" y="140">R4</text>
      <text x="38" y="212">R9</text>
      <text x="38" y="284">R14</text>
      <text x="38" y="356">R18</text>
    </g>

    <!-- ==================== SPECIAL IN-GAME MULTIPLIER CELLS ==================== -->
    <!-- 3L FIRE CELLS (Glossy Ruby Red with italic 3L) -->
    <g>
      <g transform="translate(315, 52)"><rect width="30" height="26" rx="5" fill="url(#cell3LGrad)" stroke="#f87171" stroke-width="1.2"/><rect width="30" height="12" rx="4" fill="url(#glossReflection)"/><text x="15" y="18" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" font-style="italic" text-anchor="middle">3L</text></g>
      <g transform="translate(315, 338)"><rect width="30" height="26" rx="5" fill="url(#cell3LGrad)" stroke="#f87171" stroke-width="1.2"/><rect width="30" height="12" rx="4" fill="url(#glossReflection)"/><text x="15" y="18" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" font-style="italic" text-anchor="middle">3L</text></g>
      <g transform="translate(74, 88)"><rect width="30" height="26" rx="5" fill="url(#cell3LGrad)" stroke="#f87171" stroke-width="1.2"/><rect width="30" height="12" rx="4" fill="url(#glossReflection)"/><text x="15" y="18" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" font-style="italic" text-anchor="middle">3L</text></g>
      <g transform="translate(556, 88)"><rect width="30" height="26" rx="5" fill="url(#cell3LGrad)" stroke="#f87171" stroke-width="1.2"/><rect width="30" height="12" rx="4" fill="url(#glossReflection)"/><text x="15" y="18" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" font-style="italic" text-anchor="middle">3L</text></g>
      <g transform="translate(74, 302)"><rect width="30" height="26" rx="5" fill="url(#cell3LGrad)" stroke="#f87171" stroke-width="1.2"/><rect width="30" height="12" rx="4" fill="url(#glossReflection)"/><text x="15" y="18" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" font-style="italic" text-anchor="middle">3L</text></g>
      <g transform="translate(556, 302)"><rect width="30" height="26" rx="5" fill="url(#cell3LGrad)" stroke="#f87171" stroke-width="1.2"/><rect width="30" height="12" rx="4" fill="url(#glossReflection)"/><text x="15" y="18" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" font-style="italic" text-anchor="middle">3L</text></g>
      <g transform="translate(250, 196)"><rect width="30" height="26" rx="5" fill="url(#cell3LGrad)" stroke="#f87171" stroke-width="1.2"/><rect width="30" height="12" rx="4" fill="url(#glossReflection)"/><text x="15" y="18" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" font-style="italic" text-anchor="middle">3L</text></g>
      <g transform="translate(380, 196)"><rect width="30" height="26" rx="5" fill="url(#cell3LGrad)" stroke="#f87171" stroke-width="1.2"/><rect width="30" height="12" rx="4" fill="url(#glossReflection)"/><text x="15" y="18" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" font-style="italic" text-anchor="middle">3L</text></g>
    </g>

    <!-- 2L EARTH CELLS (Glossy Emerald Green with italic 2L) -->
    <g>
      <g transform="translate(218, 124)"><rect width="30" height="26" rx="5" fill="url(#cell2LGrad)" stroke="#4ade80" stroke-width="1.2"/><rect width="30" height="12" rx="4" fill="url(#glossReflection)"/><text x="15" y="18" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" font-style="italic" text-anchor="middle">2L</text></g>
      <g transform="translate(412, 124)"><rect width="30" height="26" rx="5" fill="url(#cell2LGrad)" stroke="#4ade80" stroke-width="1.2"/><rect width="30" height="12" rx="4" fill="url(#glossReflection)"/><text x="15" y="18" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" font-style="italic" text-anchor="middle">2L</text></g>
      <g transform="translate(218, 268)"><rect width="30" height="26" rx="5" fill="url(#cell2LGrad)" stroke="#4ade80" stroke-width="1.2"/><rect width="30" height="12" rx="4" fill="url(#glossReflection)"/><text x="15" y="18" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" font-style="italic" text-anchor="middle">2L</text></g>
      <g transform="translate(412, 268)"><rect width="30" height="26" rx="5" fill="url(#cell2LGrad)" stroke="#4ade80" stroke-width="1.2"/><rect width="30" height="12" rx="4" fill="url(#glossReflection)"/><text x="15" y="18" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" font-style="italic" text-anchor="middle">2L</text></g>
      <g transform="translate(284, 160)"><rect width="30" height="26" rx="5" fill="url(#cell2LGrad)" stroke="#4ade80" stroke-width="1.2"/><rect width="30" height="12" rx="4" fill="url(#glossReflection)"/><text x="15" y="18" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" font-style="italic" text-anchor="middle">2L</text></g>
      <g transform="translate(346, 160)"><rect width="30" height="26" rx="5" fill="url(#cell2LGrad)" stroke="#4ade80" stroke-width="1.2"/><rect width="30" height="12" rx="4" fill="url(#glossReflection)"/><text x="15" y="18" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" font-style="italic" text-anchor="middle">2L</text></g>
      <g transform="translate(284, 232)"><rect width="30" height="26" rx="5" fill="url(#cell2LGrad)" stroke="#4ade80" stroke-width="1.2"/><rect width="30" height="12" rx="4" fill="url(#glossReflection)"/><text x="15" y="18" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" font-style="italic" text-anchor="middle">2L</text></g>
      <g transform="translate(346, 232)"><rect width="30" height="26" rx="5" fill="url(#cell2LGrad)" stroke="#4ade80" stroke-width="1.2"/><rect width="30" height="12" rx="4" fill="url(#glossReflection)"/><text x="15" y="18" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11.5" font-weight="900" font-style="italic" text-anchor="middle">2L</text></g>
    </g>

    <!-- SECRET POWER CELLS (Glowing Cyan with Yellow Lightning ⚡) -->
    <g class="anim-power-glow">
      <g transform="translate(122, 52)"><rect width="30" height="26" rx="6" fill="url(#cellPowerGrad)" stroke="#38bdf8" stroke-width="1.5"/><text x="15" y="19" fill="#facc15" font-size="15" font-weight="900" text-anchor="middle">⚡</text></g>
      <g transform="translate(508, 52)"><rect width="30" height="26" rx="6" fill="url(#cellPowerGrad)" stroke="#38bdf8" stroke-width="1.5"/><text x="15" y="19" fill="#facc15" font-size="15" font-weight="900" text-anchor="middle">⚡</text></g>
      <g transform="translate(122, 338)"><rect width="30" height="26" rx="6" fill="url(#cellPowerGrad)" stroke="#38bdf8" stroke-width="1.5"/><text x="15" y="19" fill="#facc15" font-size="15" font-weight="900" text-anchor="middle">⚡</text></g>
      <g transform="translate(508, 338)"><rect width="30" height="26" rx="6" fill="url(#cellPowerGrad)" stroke="#38bdf8" stroke-width="1.5"/><text x="15" y="19" fill="#facc15" font-size="15" font-weight="900" text-anchor="middle">⚡</text></g>
      <g transform="translate(186, 88)"><rect width="30" height="26" rx="6" fill="url(#cellPowerGrad)" stroke="#38bdf8" stroke-width="1.5"/><text x="15" y="19" fill="#facc15" font-size="15" font-weight="900" text-anchor="middle">⚡</text></g>
      <g transform="translate(444, 88)"><rect width="30" height="26" rx="6" fill="url(#cellPowerGrad)" stroke="#38bdf8" stroke-width="1.5"/><text x="15" y="19" fill="#facc15" font-size="15" font-weight="900" text-anchor="middle">⚡</text></g>
    </g>

    <!-- Center Star Cell (Row 9, Col 13) -->
    <g transform="translate(314, 194)" class="anim-star-center">
      <rect width="32" height="30" rx="6" fill="#1e1b4b" stroke="#fbbf24" stroke-width="2"/>
      <text x="16" y="22" fill="#fbbf24" font-size="18" text-anchor="middle">★</text>
    </g>

    <!-- Center Star Coordinate Tag -->
    <rect x="236" y="235" width="188" height="18" rx="9" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="330" y="247" fill="#fde68a" font-family="'Inter', sans-serif" font-size="9" font-weight="900" text-anchor="middle">
      ★ CENTER STAR (ROW 9, COL 13)
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- RIGHT: 4 MULTIPLIER SPEC CARDS MATCHING IN-GAME THEME                    -->
  <!-- ========================================================================= -->
  <g transform="translate(710, 44)">

    <!-- CARD 1: CENTER STAR -->
    <g transform="translate(0, 0)" filter="url(#matrixShadow)">
      <rect width="460" height="88" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.4"/>
      <!-- Center Star replica badge -->
      <g transform="translate(14, 18)">
        <rect width="50" height="52" rx="8" fill="#1e1b4b" stroke="#fbbf24" stroke-width="1.8"/>
        <text x="25" y="34" fill="#fbbf24" font-size="26" text-anchor="middle">★</text>
      </g>
      <text x="76" y="33" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="13" font-weight="900">★ CENTER STAR (9, 13)</text>
      <text x="76" y="52" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600">
        Mandatory Opening Move Anchor
      </text>
      <text x="76" y="70" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11.5">
        First word of the match must cover this coordinate.
      </text>
    </g>

    <!-- CARD 2: TRIPLE LETTER (3L FIRE) -->
    <g transform="translate(0, 100)" filter="url(#matrixShadow)">
      <rect width="460" height="88" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="1.3"/>
      <!-- In-game 3L Fire replica badge -->
      <g transform="translate(14, 18)">
        <rect width="50" height="52" rx="8" fill="url(#cell3LGrad)" stroke="#f87171" stroke-width="1.6"/>
        <rect width="50" height="24" rx="7" fill="url(#glossReflection)"/>
        <text x="25" y="33" fill="#ffffff" font-family="'Inter', sans-serif" font-size="19" font-weight="900" font-style="italic" text-anchor="middle">3L</text>
      </g>
      <text x="76" y="33" fill="#f87171" font-family="'Inter', sans-serif" font-size="13" font-weight="900">TRIPLE LETTER (3× MULTIPLIER)</text>
      <text x="76" y="52" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600">
        Triples newly placed tile point value
      </text>
      <text x="76" y="70" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11.5">
        Applies across all newly formed intersecting words.
      </text>
    </g>

    <!-- CARD 3: DOUBLE LETTER (2L EARTH) -->
    <g transform="translate(0, 200)" filter="url(#matrixShadow)">
      <rect width="460" height="88" rx="10" fill="#0f172a" stroke="#22c55e" stroke-width="1.3"/>
      <!-- In-game 2L Earth replica badge -->
      <g transform="translate(14, 18)">
        <rect width="50" height="52" rx="8" fill="url(#cell2LGrad)" stroke="#4ade80" stroke-width="1.6"/>
        <rect width="50" height="24" rx="7" fill="url(#glossReflection)"/>
        <text x="25" y="33" fill="#ffffff" font-family="'Inter', sans-serif" font-size="19" font-weight="900" font-style="italic" text-anchor="middle">2L</text>
      </g>
      <text x="76" y="33" fill="#4ade80" font-family="'Inter', sans-serif" font-size="13" font-weight="900">DOUBLE LETTER (2× MULTIPLIER)</text>
      <text x="76" y="52" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600">
        Doubles newly placed letter value
      </text>
      <text x="76" y="70" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11.5">
        Strategic stepping stone for high-yield combos.
      </text>
    </g>

    <!-- CARD 4: SECRET POWER SQUARE (⚡) -->
    <g transform="translate(0, 300)" filter="url(#matrixShadow)">
      <rect width="460" height="92" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="1.3"/>
      <!-- In-game Power cell replica badge -->
      <g transform="translate(14, 20)">
        <rect width="50" height="52" rx="10" fill="url(#cellPowerGrad)" stroke="#38bdf8" stroke-width="1.8"/>
        <rect width="50" height="24" rx="8" fill="url(#glossReflection)"/>
        <text x="25" y="36" fill="#facc15" font-size="26" font-weight="900" text-anchor="middle">⚡</text>
      </g>
      <text x="76" y="34" fill="#22d3ee" font-family="'Inter', sans-serif" font-size="13" font-weight="900">SECRET POWER SQUARE (⚡)</text>
      <text x="76" y="53" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600">
        Power Cards Drop &amp; All-7-Tiles Bonus
      </text>
      <text x="76" y="71" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11.5">
        Power cell awards tactical card. 7-tile bingo yields +50 pts!
      </text>
    </g>
  </g>
</svg>
