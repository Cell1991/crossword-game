<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="treeBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#090d16" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>

    <!-- Branch Gradients -->
    <linearGradient id="branchRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <linearGradient id="branchGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="branchPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="branchCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="nodeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <style>
      @keyframes energyPulse {
        to { stroke-dashoffset: -32; }
      }
      @keyframes coreGlow {
        0%, 100% { stroke-opacity: 0.4; }
        50% { stroke-opacity: 1.0; }
      }
      .anim-stream-red { stroke-dasharray: 6 6; animation: energyPulse 2.2s linear infinite; }
      .anim-stream-green { stroke-dasharray: 6 6; animation: energyPulse 2.6s linear infinite; }
      .anim-stream-purple { stroke-dasharray: 6 6; animation: energyPulse 2.4s linear infinite; }
      .anim-stream-cyan { stroke-dasharray: 6 6; animation: energyPulse 2.8s linear infinite; }
      .anim-core { animation: coreGlow 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="480" fill="url(#treeBg)" rx="16"/>

  <!-- Subtle Matrix Pattern Grid -->
  <g opacity="0.12" stroke="#475569" stroke-width="0.75" stroke-dasharray="2 6">
    <path d="M 0 80 L 1200 80 M 0 160 L 1200 160 M 0 240 L 1200 240 M 0 320 L 1200 320 M 0 400 L 1200 400"/>
    <path d="M 200 0 L 200 480 M 400 0 L 400 480 M 600 0 L 600 480 M 800 0 L 800 480 M 1000 0 L 1000 480"/>
  </g>

  <!-- Title Header Inside SVG -->
  <g transform="translate(600, 24)">
    <text x="0" y="0" fill="#64748b" font-family="'Inter', sans-serif" font-size="10" font-weight="900" text-anchor="middle" letter-spacing="4">
      TACTICAL MATCH ARBITRATION TREE
    </text>
  </g>

  <!-- ==================== CONNECTING GLOWING BRANCH PATHS ==================== -->
  <g fill="none">
    <!-- Static Base Backing Paths -->
    <path d="M 260 240 C 380 240, 420 75, 590 75" stroke="#334155" stroke-width="3"/>
    <path d="M 260 240 C 380 240, 420 185, 590 185" stroke="#334155" stroke-width="3"/>
    <path d="M 260 240 C 380 240, 420 295, 590 295" stroke="#334155" stroke-width="3"/>
    <path d="M 260 240 C 380 240, 420 405, 590 405" stroke="#334155" stroke-width="3"/>

    <!-- Animated Glowing Energy Streams -->
    <path d="M 260 240 C 380 240, 420 75, 590 75" stroke="url(#branchRed)" stroke-width="2.5" class="anim-stream-red"/>
    <path d="M 260 240 C 380 240, 420 185, 590 185" stroke="url(#branchGreen)" stroke-width="2.5" class="anim-stream-green"/>
    <path d="M 260 240 C 380 240, 420 295, 590 295" stroke="url(#branchPurple)" stroke-width="2.5" class="anim-stream-purple"/>
    <path d="M 260 240 C 380 240, 420 405, 590 405" stroke="url(#branchCyan)" stroke-width="2.5" class="anim-stream-cyan"/>
  </g>

  <!-- ==================== LEFT ROOT: SELECT GAME MODE DIAMOND ==================== -->
  <g transform="translate(140, 240)" filter="url(#nodeShadow)">
    <!-- Outer Diamond -->
    <polygon points="0,-75 95,0 0,75 -95,0" fill="#0f172a" stroke="#f59e0b" stroke-width="2" class="anim-core"/>
    <!-- Inner Accent Diamond -->
    <polygon points="0,-60 76,0 0,60 -76,0" fill="#1e293b" fill-opacity="0.6" stroke="#fbbf24" stroke-width="1"/>
    
    <text x="0" y="-14" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1">
      🎮 MATCH SETUP
    </text>
    <text x="0" y="8" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="15" font-weight="900" text-anchor="middle">
      Select Mode
    </text>
    <text x="0" y="26" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">
      Lobby Ruleset
    </text>
  </g>

  <!-- ==================== MID-PATH CONDITION PILLS ==================== -->
  
  <!-- Pill 1: HP Elimination -->
  <g transform="translate(420, 63)">
    <rect width="135" height="24" rx="12" fill="#1e1b4b" stroke="#ef4444" stroke-width="1.2"/>
    <text x="67" y="16" fill="#fca5a5" font-family="'Inter', sans-serif" font-size="10" font-weight="800" text-anchor="middle">
      ⚔️ HP Elimination
    </text>
  </g>

  <!-- Pill 2: Classic Scoring -->
  <g transform="translate(420, 173)">
    <rect width="135" height="24" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
    <text x="67" y="16" fill="#6ee7b7" font-family="'Inter', sans-serif" font-size="10" font-weight="800" text-anchor="middle">
      🏆 Classic Scoring
    </text>
  </g>

  <!-- Pill 3: Solo / Fill -->
  <g transform="translate(420, 283)">
    <rect width="135" height="24" rx="12" fill="#581c87" stroke="#c084fc" stroke-width="1.2"/>
    <text x="67" y="16" fill="#e9d5ff" font-family="'Inter', sans-serif" font-size="10" font-weight="800" text-anchor="middle">
      🤖 Solo / Fill AI
    </text>
  </g>

  <!-- Pill 4: Watch Live -->
  <g transform="translate(420, 393)">
    <rect width="135" height="24" rx="12" fill="#0369a1" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="67" y="16" fill="#7dd3fc" font-family="'Inter', sans-serif" font-size="10" font-weight="800" text-anchor="middle">
      👁️ Watch Live
    </text>
  </g>

  <!-- ==================== RIGHT BRANCH CARDS ==================== -->

  <!-- CARD 1: HP DEATHMATCH (y = 30) -->
  <g transform="translate(590, 30)" filter="url(#nodeShadow)">
    <rect width="570" height="90" rx="12" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="0" y="0" width="570" height="28" rx="12" fill="#991b1b" fill-opacity="0.3"/>
    <text x="20" y="19" fill="#fca5a5" font-family="'Inter', sans-serif" font-size="12" font-weight="900" letter-spacing="1">
      ⚔️ HP DEATHMATCH • BATTLE ROYALE ELIMINATION
    </text>
    <rect x="475" y="5" width="80" height="18" rx="9" fill="#7f1d1d" stroke="#ef4444" stroke-width="1"/>
    <text x="515" y="17" fill="#fee2e2" font-family="'Inter', sans-serif" font-size="9" font-weight="800" text-anchor="middle">10 - 1000 HP</text>

    <!-- Checklist -->
    <g transform="translate(20, 48)" font-family="'Inter', sans-serif" font-size="11" fill="#cbd5e1">
      <text y="0"><tspan fill="#f87171" font-weight="800">• Direct HP Damage:</tspan> Scored word points convert to lethal damage dealt to rivals</text>
      <text y="18"><tspan fill="#f87171" font-weight="800">• Reactive Defense:</tspan> 1.0s Shield reaction window &amp; rack-based Heal mechanics</text>
      <text y="36"><tspan fill="#f87171" font-weight="800">• Victory:</tspan> Last surviving player standing claims victory; 0 HP becomes Spectator</text>
    </g>
  </g>

  <!-- CARD 2: TURN COUNT MODE (y = 140) -->
  <g transform="translate(590, 140)" filter="url(#nodeShadow)">
    <rect width="570" height="90" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <rect x="0" y="0" width="570" height="28" rx="12" fill="#064e3b" fill-opacity="0.3"/>
    <text x="20" y="19" fill="#6ee7b7" font-family="'Inter', sans-serif" font-size="12" font-weight="900" letter-spacing="1">
      🏆 TURN COUNT MODE • CLASSIC TOURNAMENT SCORING
    </text>
    <rect x="475" y="5" width="80" height="18" rx="9" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="515" y="17" fill="#d1fae5" font-family="'Inter', sans-serif" font-size="9" font-weight="800" text-anchor="middle">7 - 500 ROUNDS</text>

    <!-- Checklist -->
    <g transform="translate(20, 48)" font-family="'Inter', sans-serif" font-size="11" fill="#cbd5e1">
      <text y="0"><tspan fill="#34d399" font-weight="800">• Cumulative Points:</tspan> Highest total points scored across rounds wins the match</text>
      <text y="18"><tspan fill="#34d399" font-weight="800">• Pure Word Strategy:</tspan> HP cards automatically excluded from random drops</text>
      <text y="36"><tspan fill="#34d399" font-weight="800">• Multiplier Mastery:</tspan> Focus on 3L, 2L matrix yields and 50-point all-tile Bingos</text>
    </g>
  </g>

  <!-- CARD 3: AI BOT ARENA (y = 250) -->
  <g transform="translate(590, 250)" filter="url(#nodeShadow)">
    <rect width="570" height="90" rx="12" fill="#0f172a" stroke="#c084fc" stroke-width="1.5"/>
    <rect x="0" y="0" width="570" height="28" rx="12" fill="#581c87" fill-opacity="0.3"/>
    <text x="20" y="19" fill="#e9d5ff" font-family="'Inter', sans-serif" font-size="12" font-weight="900" letter-spacing="1">
      🤖 AI BOT ARENA • AUTONOMOUS OPPONENT TRIAD
    </text>
    <rect x="475" y="5" width="80" height="18" rx="9" fill="#4a044e" stroke="#c084fc" stroke-width="1"/>
    <text x="515" y="17" fill="#fae8ff" font-family="'Inter', sans-serif" font-size="9" font-weight="800" text-anchor="middle">3 TIERS</text>

    <!-- Checklist -->
    <g transform="translate(20, 48)" font-family="'Inter', sans-serif" font-size="11" fill="#cbd5e1">
      <text y="0"><tspan fill="#c084fc" font-weight="800">• Bot Difficulty:</tspan> SparkBot (Easy 5-15pts), Nexus AI (Medium), Titan AI (Hard)</text>
      <text y="18"><tspan fill="#c084fc" font-weight="800">• Autonomous Engine:</tspan> CSW24 anagram solver with pass &amp; tile exchange intelligence</text>
      <text y="36"><tspan fill="#c084fc" font-weight="800">• Flexible Play:</tspan> Practice solo offline or auto-fill empty seats in multiplayer rooms</text>
    </g>
  </g>

  <!-- CARD 4: SPECTATOR STREAM (y = 360) -->
  <g transform="translate(590, 360)" filter="url(#nodeShadow)">
    <rect width="570" height="90" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="570" height="28" rx="12" fill="#0369a1" fill-opacity="0.3"/>
    <text x="20" y="19" fill="#7dd3fc" font-family="'Inter', sans-serif" font-size="12" font-weight="900" letter-spacing="1">
      👁️ SPECTATOR STREAM • ZERO-SEAT REAL-TIME OBSERVER
    </text>
    <rect x="475" y="5" width="80" height="18" rx="9" fill="#075985" stroke="#38bdf8" stroke-width="1"/>
    <text x="515" y="17" fill="#e0f2fe" font-family="'Inter', sans-serif" font-size="9" font-weight="800" text-anchor="middle">UNLIMITED</text>

    <!-- Checklist -->
    <g transform="translate(20, 48)" font-family="'Inter', sans-serif" font-size="11" fill="#cbd5e1">
      <text y="0"><tspan fill="#38bdf8" font-weight="800">• Live Ghost Streaming:</tspan> Watch staged tiles placed live via WebSocket stream</text>
      <text y="18"><tspan fill="#38bdf8" font-weight="800">• Anti-Cheat Security:</tspan> Secret player tile racks hidden from observers</text>
      <text y="36"><tspan fill="#38bdf8" font-weight="800">• Instant Rematch:</tspan> Synchronized lobby rematch transition after match conclusion</text>
    </g>
  </g>
</svg>
