<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%">
 <defs>
 <!-- Background Gradient -->
 <radialGradient id="seqBg" cx="50%" cy="50%" r="70%">
 <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
 <stop offset="60%" stop-color="#090d16" stop-opacity="0.98"/>
 <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
 </radialGradient>

 <!-- Drop Shadow -->
 <filter id="seqShadow" x="-10%" y="-10%" width="120%" height="120%">
 <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
 </filter>

 <style>
 @keyframes slowPulse {
 0%, 100% { stroke-opacity: 0.35; }
 50% { stroke-opacity: 0.95; }
 }
 @keyframes dashMove {
 to { stroke-dashoffset: -30; }
 }
 .seq-pulse { animation: slowPulse 5s ease-in-out infinite; }
 .seq-dash { stroke-dasharray: 6 5; animation: dashMove 2s linear infinite; }
 </style>
 </defs>

 <rect width="1200" height="620" fill="url(#seqBg)" rx="16"/>

 <!-- Title -->
 <g transform="translate(600, 32)">
 <text x="0" y="0" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="4">
 INTERACTIVE TURN ARBITRATION
 </text>
 <text x="0" y="24" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="19" font-weight="900" text-anchor="middle">
 Real-Time Move, Scoring &amp; Shield Sequence
 </text>
 </g>

 <!-- ==================== SWIMLANES (ACTORS) ==================== -->
 <!-- Actor 1: Player 1 (x = 120) -->
 <g transform="translate(120, 75)">
 <rect x="-80" y="0" width="160" height="42" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
 <text x="0" y="26" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="12" font-weight="900" text-anchor="middle"> Player 1 (Active)</text>
 <line x1="0" y1="42" x2="0" y2="520" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
 </g>

 <!-- Actor 2: Canvas / HUD (x = 360) -->
 <g transform="translate(360, 75)">
 <rect x="-80" y="0" width="160" height="42" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
 <text x="0" y="26" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="12" font-weight="900" text-anchor="middle"> 60 FPS Canvas</text>
 <line x1="0" y1="42" x2="0" y2="520" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
 </g>

 <!-- Actor 3: WebSocket Hub (x = 600) -->
 <g transform="translate(600, 75)">
 <rect x="-80" y="0" width="160" height="42" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
 <text x="0" y="26" fill="#c084fc" font-family="'Inter', sans-serif" font-size="12" font-weight="900" text-anchor="middle"> WebSocket Hub</text>
 <line x1="0" y1="42" x2="0" y2="520" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
 </g>

 <!-- Actor 4: Backend Engine (x = 840) -->
 <g transform="translate(840, 75)">
 <rect x="-80" y="0" width="160" height="42" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
 <text x="0" y="26" fill="#34d399" font-family="'Inter', sans-serif" font-size="12" font-weight="900" text-anchor="middle"> FastAPI Engine</text>
 <line x1="0" y1="42" x2="0" y2="520" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
 </g>

 <!-- Actor 5: Player 2 Rival (x = 1080) -->
 <g transform="translate(1080, 75)">
 <rect x="-80" y="0" width="160" height="42" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
 <text x="0" y="26" fill="#f87171" font-family="'Inter', sans-serif" font-size="12" font-weight="900" text-anchor="middle"> Player 2 (Rival)</text>
 <line x1="0" y1="42" x2="0" y2="520" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
 </g>

 <!-- ==================== MESSAGES / INTERACTIONS ==================== -->

 <!-- 1. Drag &amp; Stage -->
 <g transform="translate(0, 145)">
 <line x1="120" y1="0" x2="360" y2="0" stroke="#38bdf8" stroke-width="2"/>
 <polygon points="355,-4 360,0 355,4" fill="#38bdf8"/>
 <rect x="150" y="-14" width="180" height="20" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
 <text x="240" y="0" fill="#7dd3fc" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">1. Drag &amp; stage tiles on grid</text>
 </g>

 <!-- 2. Validate Provisional -->
 <g transform="translate(0, 185)">
 <line x1="360" y1="0" x2="840" y2="0" stroke="#fbbf24" stroke-width="2"/>
 <polygon points="835,-4 840,0 835,4" fill="#fbbf24"/>
 <rect x="490" y="-14" width="220" height="20" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
 <text x="600" y="0" fill="#fde68a" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">2. POST /api/moves/validate (Dry-run)</text>
 </g>

 <!-- 3. Placement Preview Ghost -->
 <g transform="translate(0, 225)">
 <line x1="360" y1="0" x2="600" y2="0" stroke="#818cf8" stroke-width="2"/>
 <polygon points="595,-4 600,0 595,4" fill="#818cf8"/>
 <line x1="600" y1="0" x2="1080" y2="0" stroke="#818cf8" stroke-width="2" class="seq-dash"/>
 <polygon points="1075,-4 1080,0 1075,4" fill="#818cf8"/>
 <rect x="710" y="-14" width="260" height="20" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
 <text x="840" y="0" fill="#c7d2fe" font-family="'Inter', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">3. Broadcast EVENT: PLACEMENT_PREVIEW</text>
 </g>

 <!-- 4. Confirm Move -->
 <g transform="translate(0, 265)">
 <line x1="120" y1="0" x2="360" y2="0" stroke="#38bdf8" stroke-width="2"/>
 <polygon points="355,-4 360,0 355,4" fill="#38bdf8"/>
 <line x1="360" y1="0" x2="840" y2="0" stroke="#34d399" stroke-width="2"/>
 <polygon points="835,-4 840,0 835,4" fill="#34d399"/>
 <rect x="490" y="-14" width="220" height="20" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
 <text x="600" y="0" fill="#6ee7b7" font-family="'Inter', sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">4. POST /api/moves/commit</text>
 </g>

 <!-- 5. Engine Processing Block (Self Call) -->
 <g transform="translate(840, 295)">
 <rect x="0" y="0" width="220" height="42" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
 <text x="12" y="16" fill="#a7f3d0" font-family="'Inter', sans-serif" font-size="9" font-weight="800">5. CSW24 Check &amp; Multipliers</text>
 <text x="12" y="30" fill="#d1fae5" font-family="'Inter', sans-serif" font-size="8.5">• Compute 2L/3L • Bingo • Power Drops</text>
 </g>

 <!-- 6. 1.0s Shield Reaction Window Box -->
 <g transform="translate(560, 355)" filter="url(#seqShadow)">
 <rect x="0" y="0" width="560" height="110" rx="10" fill="#451a03" fill-opacity="0.3" stroke="#f59e0b" stroke-width="1.5" class="seq-pulse"/>
 <rect x="15" y="10" width="190" height="20" rx="10" fill="#78350f"/>
 <text x="110" y="24" fill="#fde68a" font-family="'Inter', sans-serif" font-size="9.5" font-weight="900" text-anchor="middle"> 1.0s SHIELD REACTION WINDOW</text>

 <!-- Event Pending -->
 <line x1="280" y1="45" x2="40" y2="45" stroke="#f59e0b" stroke-width="1.5"/>
 <polygon points="45,41 40,45 45,49" fill="#f59e0b"/>
 <line x1="40" y1="45" x2="520" y2="45" stroke="#f59e0b" stroke-width="1.5"/>
 <polygon points="515,41 520,45 515,49" fill="#f59e0b"/>
 <text x="280" y="40" fill="#fde68a" font-family="'Inter', sans-serif" font-size="9" font-weight="700" text-anchor="middle">Broadcast EVENT: EFFECT_PENDING (DAMAGE)</text>

 <!-- Optional Shield Use -->
 <line x1="520" y1="85" x2="280" y2="85" stroke="#60a5fa" stroke-width="1.5"/>
 <polygon points="285,81 280,85 285,89" fill="#60a5fa"/>
 <text x="400" y="80" fill="#93c5fd" font-family="'Inter', sans-serif" font-size="9" font-weight="700" text-anchor="middle">Optional: POST /api/cards/use (SHIELD Negates Attack)</text>
 </g>

 <!-- 7. Commit &amp; Damage Sync -->
 <g transform="translate(0, 490)">
 <line x1="840" y1="0" x2="600" y2="0" stroke="#10b981" stroke-width="2"/>
 <polygon points="605,-4 600,0 605,4" fill="#10b981"/>
 <line x1="600" y1="0" x2="120" y2="0" stroke="#38bdf8" stroke-width="2"/>
 <polygon points="125,-4 120,0 125,4" fill="#38bdf8"/>
 <line x1="600" y1="0" x2="1080" y2="0" stroke="#ef4444" stroke-width="2"/>
 <polygon points="1075,-4 1080,0 1075,4" fill="#ef4444"/>
 <rect x="470" y="-14" width="260" height="20" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
 <text x="600" y="0" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="9.5" font-weight="900" text-anchor="middle">7. Broadcast EVENT: MOVE_COMMITTED</text>
 </g>

 <!-- 8. Final Client State Updates -->
 <g transform="translate(120, 545)">
 <rect x="-80" y="0" width="160" height="32" rx="6" fill="#0c4a6e" stroke="#0284c7" stroke-width="1"/>
 <text x="0" y="20" fill="#7dd3fc" font-family="'Inter', sans-serif" font-size="9" font-weight="800" text-anchor="middle">Refill Rack • Score FX</text>
 </g>
 <g transform="translate(1080, 545)">
 <rect x="-80" y="0" width="160" height="32" rx="6" fill="#7f1d1d" stroke="#ef4444" stroke-width="1"/>
 <text x="0" y="20" fill="#fca5a5" font-family="'Inter', sans-serif" font-size="9" font-weight="800" text-anchor="middle">Deduct HP • Start Clock</text>
 </g>
</svg>
