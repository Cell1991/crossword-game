<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#0f172a" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="cyberGrid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.03"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Tile 3D Golden Gradients -->
    <linearGradient id="tileFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="15%" stop-color="#fbbf24"/>
      <stop offset="55%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="tileBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#451a03" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="tileRemoteFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="tileShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <!-- Text Gradients -->
    <linearGradient id="titleGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="titleCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="neonBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="25%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="75%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-9px) rotate(1.5deg); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-13px) rotate(-2deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.45; filter: drop-shadow(0 0 15px rgba(245, 158, 11, 0.4)); }
        50% { opacity: 0.85; filter: drop-shadow(0 0 35px rgba(245, 158, 11, 0.85)); }
      }
      @keyframes laserScan {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      @keyframes energyPulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.9; }
      }
      @keyframes badgeShine {
        0% { transform: translateX(-150px) skewX(-20deg); }
        30%, 100% { transform: translateX(1300px) skewX(-20deg); }
      }
      .floating-tile-1 { animation: floatSlow 6.8s ease-in-out infinite; }
      .floating-tile-2 { animation: floatFast 6.2s ease-in-out infinite 0.6s; }
      .floating-tile-3 { animation: floatSlow 7.2s ease-in-out infinite 1.2s; }
      .floating-tile-4 { animation: floatFast 6.5s ease-in-out infinite 1.8s; }
      .floating-tile-5 { animation: floatSlow 7.0s ease-in-out infinite 2.4s; }
      .laser-glow { animation: energyPulse 4.5s ease-in-out infinite; }
      .pulsing-aura { animation: pulseGlow 3.5s ease-in-out infinite; }
      .badge-streak { animation: badgeShine 6s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGlow)" rx="16"/>

  <!-- Geometric Circuit & Grid Lines -->
  <g opacity="0.35">
    <path d="M 0 60 L 1200 60 M 0 120 L 1200 120 M 0 180 L 1200 180 M 0 240 L 1200 240 M 0 300 L 1200 300 M 0 360 L 1200 360" stroke="#475569" stroke-width="0.75" stroke-dasharray="3 9"/>
    <path d="M 100 0 L 100 420 M 200 0 L 200 420 M 300 0 L 300 420 M 400 0 L 400 420 M 500 0 L 500 420 M 600 0 L 600 420 M 700 0 L 700 420 M 800 0 L 800 420 M 900 0 L 900 420 M 1000 0 L 1000 420 M 1100 0 L 1100 420" stroke="#475569" stroke-width="0.75" stroke-dasharray="3 9"/>
    <!-- Cyber Diagonal Accents -->
    <path d="M 0 100 L 120 0 M 1080 420 L 1200 320 M 0 340 L 80 420 M 1120 0 L 1200 80" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.4"/>
  </g>

  <!-- Neon Ambient Halos -->
  <circle cx="600" cy="180" r="220" fill="#3b82f6" opacity="0.12" filter="url(#glowCyan)"/>
  <circle cx="340" cy="200" r="140" fill="#f59e0b" opacity="0.10" filter="url(#glowGold)"/>
  <circle cx="860" cy="200" r="140" fill="#ec4899" opacity="0.10" filter="url(#glowPink)"/>

  <!-- Top Cyber Status Ribbon -->
  <g transform="translate(600, 38)">
    <rect x="-210" y="-14" width="420" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <circle cx="-185" cy="0" r="4" fill="#10b981" class="laser-glow"/>
    <text x="-165" y="4" fill="#94a3b8" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="2">
      NEXT-GEN REAL-TIME MULTIPLAYER
    </text>
    <rect x="95" y="-9" width="95" height="18" rx="9" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="142" y="3" fill="#a5b4fc" font-family="'Inter', sans-serif" font-size="9.5" font-weight="800" text-anchor="middle" letter-spacing="1">
      CSW24 LEXICON
    </text>
  </g>

  <!-- Main Animated 3D Scrabble Tile Row: W - O - R - D - X -->
  <g id="tileGroup" transform="translate(600, 155)">
    <!-- W Tile -->
    <g class="floating-tile-1" transform="translate(-250, 0)">
      <g filter="url(#tileShadow)">
        <rect x="-42" y="-45" width="84" height="88" rx="14" fill="url(#tileFace)" stroke="url(#tileBorder)" stroke-width="2"/>
        <rect x="-37" y="-40" width="74" height="40" rx="9" fill="#ffffff" fill-opacity="0.15"/>
        <text x="-2" y="16" fill="#180c02" font-family="'Impact', 'Arial Black', sans-serif" font-size="52" font-weight="900" text-anchor="middle" letter-spacing="-1">W</text>
        <text x="24" y="31" fill="#451a03" font-family="'Inter', sans-serif" font-size="14" font-weight="900" text-anchor="middle">4</text>
      </g>
    </g>

    <!-- O Tile -->
    <g class="floating-tile-2" transform="translate(-125, 0)">
      <g filter="url(#tileShadow)">
        <rect x="-42" y="-45" width="84" height="88" rx="14" fill="url(#tileFace)" stroke="url(#tileBorder)" stroke-width="2"/>
        <rect x="-37" y="-40" width="74" height="40" rx="9" fill="#ffffff" fill-opacity="0.15"/>
        <text x="-2" y="16" fill="#180c02" font-family="'Impact', 'Arial Black', sans-serif" font-size="52" font-weight="900" text-anchor="middle">O</text>
        <text x="24" y="31" fill="#451a03" font-family="'Inter', sans-serif" font-size="14" font-weight="900" text-anchor="middle">1</text>
      </g>
    </g>

    <!-- R Tile -->
    <g class="floating-tile-3" transform="translate(0, 0)">
      <g filter="url(#tileShadow)">
        <rect x="-42" y="-45" width="84" height="88" rx="14" fill="url(#tileFace)" stroke="url(#tileBorder)" stroke-width="2"/>
        <rect x="-37" y="-40" width="74" height="40" rx="9" fill="#ffffff" fill-opacity="0.15"/>
        <text x="-2" y="16" fill="#180c02" font-family="'Impact', 'Arial Black', sans-serif" font-size="52" font-weight="900" text-anchor="middle">R</text>
        <text x="24" y="31" fill="#451a03" font-family="'Inter', sans-serif" font-size="14" font-weight="900" text-anchor="middle">1</text>
      </g>
    </g>

    <!-- D Tile -->
    <g class="floating-tile-4" transform="translate(125, 0)">
      <g filter="url(#tileShadow)">
        <rect x="-42" y="-45" width="84" height="88" rx="14" fill="url(#tileFace)" stroke="url(#tileBorder)" stroke-width="2"/>
        <rect x="-37" y="-40" width="74" height="40" rx="9" fill="#ffffff" fill-opacity="0.15"/>
        <text x="-2" y="16" fill="#180c02" font-family="'Impact', 'Arial Black', sans-serif" font-size="52" font-weight="900" text-anchor="middle">D</text>
        <text x="24" y="31" fill="#451a03" font-family="'Inter', sans-serif" font-size="14" font-weight="900" text-anchor="middle">2</text>
      </g>
    </g>

    <!-- X Tile (Special Neon Accent) -->
    <g class="floating-tile-5" transform="translate(250, 0)">
      <g filter="url(#tileShadow)">
        <rect x="-42" y="-45" width="84" height="88" rx="14" fill="url(#tileFace)" stroke="#f59e0b" stroke-width="2"/>
        <rect x="-37" y="-40" width="74" height="40" rx="9" fill="#ffffff" fill-opacity="0.2"/>
        <text x="-2" y="16" fill="#991b1b" font-family="'Impact', 'Arial Black', sans-serif" font-size="52" font-weight="900" text-anchor="middle">X</text>
        <text x="24" y="31" fill="#7f1d1d" font-family="'Inter', sans-serif" font-size="14" font-weight="900" text-anchor="middle">8</text>
        <circle cx="28" cy="-28" r="6" fill="#ef4444" filter="url(#glowPink)"/>
      </g>
    </g>
  </g>

  <!-- Arena Subtitle Branding -->
  <g transform="translate(600, 260)">
    <text x="0" y="0" fill="url(#titleCyan)" font-family="'Inter', -apple-system, sans-serif" font-size="28" font-weight="900" text-anchor="middle" letter-spacing="10" filter="url(#glowCyan)">
      CROSSWORD BATTLE ARENA
    </text>
    <text x="0" y="26" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="3">
      TACTICAL WORD COMBAT • 19×27 MATRIX • POWER CARDS • 60 FPS CANVAS
    </text>
  </g>

  <!-- Glowing Gradient Divider Beam -->
  <g transform="translate(200, 318)">
    <rect x="0" y="0" width="800" height="2" fill="url(#neonBarGrad)" filter="url(#glowCyan)"/>
    <circle cx="400" cy="1" r="5" fill="#f8fafc" filter="url(#glowGold)"/>
  </g>

  <!-- Tech Badges Bar (Bottom) -->
  <g transform="translate(600, 365)">
    <!-- Next.js Badge -->
    <g transform="translate(-360, 0)">
      <rect x="-65" y="-15" width="130" height="30" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
      <text x="0" y="5" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">⚡ Next.js 16</text>
    </g>
    <!-- React 19 Badge -->
    <g transform="translate(-215, 0)">
      <rect x="-65" y="-15" width="130" height="30" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1.2"/>
      <text x="0" y="5" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">⚛️ React 19</text>
    </g>
    <!-- FastAPI Badge -->
    <g transform="translate(-70, 0)">
      <rect x="-65" y="-15" width="130" height="30" rx="8" fill="#0f172a" stroke="#059669" stroke-width="1.2"/>
      <text x="0" y="5" fill="#34d399" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">🚀 FastAPI 0.115</text>
    </g>
    <!-- Canvas 60 FPS Badge -->
    <g transform="translate(75, 0)">
      <rect x="-65" y="-15" width="130" height="30" rx="8" fill="#0f172a" stroke="#d97706" stroke-width="1.2"/>
      <text x="0" y="5" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">🎨 60 FPS Canvas</text>
    </g>
    <!-- WebSocket Badge -->
    <g transform="translate(220, 0)">
      <rect x="-65" y="-15" width="130" height="30" rx="8" fill="#0f172a" stroke="#7c3aed" stroke-width="1.2"/>
      <text x="0" y="5" fill="#c084fc" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">⚡ WebSockets</text>
    </g>
    <!-- Docker Compose Badge -->
    <g transform="translate(365, 0)">
      <rect x="-65" y="-15" width="130" height="30" rx="8" fill="#0f172a" stroke="#2563eb" stroke-width="1.2"/>
      <text x="0" y="5" fill="#60a5fa" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">🐳 Docker Ready</text>
    </g>
  </g>
</svg>
