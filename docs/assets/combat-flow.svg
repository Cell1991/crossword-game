<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="100%" height="100%">
  <defs>
    <radialGradient id="loopBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="1"/>
    </radialGradient>

    <style>
      @keyframes pulseStep {
        0%, 100% { opacity: 0.7; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.02); filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.4)); }
      }
      @keyframes arrowMove {
        0%, 100% { transform: translateX(0); }
        50% { transform: translateX(4px); }
      }
      .step-1 { animation: pulseStep 3s ease-in-out infinite; }
      .step-2 { animation: pulseStep 3s ease-in-out infinite 0.6s; }
      .step-3 { animation: pulseStep 3s ease-in-out infinite 1.2s; }
      .step-4 { animation: pulseStep 3s ease-in-out infinite 1.8s; }
      .step-5 { animation: pulseStep 3s ease-in-out infinite 2.4s; }
      .arrow-anim { animation: arrowMove 1.5s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="1200" height="220" fill="url(#loopBg)" rx="14" stroke="#1f2937" stroke-width="1.2"/>

  <!-- Step 1: Tile Placement -->
  <g class="step-1" transform="translate(30, 30)">
    <rect width="200" height="160" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="200" height="32" rx="10" fill="#0284c7" fill-opacity="0.3"/>
    <text x="100" y="21" fill="#7dd3fc" font-family="'Inter', sans-serif" font-size="11" font-weight="900" text-anchor="middle">STEP 1 • DRAG &amp; STAGE</text>
    <text x="100" y="70" font-size="28" text-anchor="middle">🎯</text>
    <text x="100" y="105" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13" font-weight="800" text-anchor="middle">Place on Matrix</text>
    <text x="100" y="125" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">
      <tspan x="100" dy="0">Snap to 19×27 grid</tspan>
      <tspan x="100" dy="14">Live score estimation</tspan>
    </text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g class="arrow-anim" transform="translate(242, 105)">
    <text fill="#38bdf8" font-size="20" font-weight="900">➔</text>
  </g>

  <!-- Step 2: Ghost Preview -->
  <g class="step-2" transform="translate(270, 30)">
    <rect width="200" height="160" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
    <rect x="0" y="0" width="200" height="32" rx="10" fill="#4f46e5" fill-opacity="0.3"/>
    <text x="100" y="21" fill="#a5b4fc" font-family="'Inter', sans-serif" font-size="11" font-weight="900" text-anchor="middle">STEP 2 • LIVE GHOST</text>
    <text x="100" y="70" font-size="28" text-anchor="middle">👻</text>
    <text x="100" y="105" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13" font-weight="800" text-anchor="middle">WebSocket Broadcast</text>
    <text x="100" y="125" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">
      <tspan x="100" dy="0">Rivals see translucent</tspan>
      <tspan x="100" dy="14">tile placement ghosts</tspan>
    </text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g class="arrow-anim" transform="translate(482, 105)">
    <text fill="#818cf8" font-size="20" font-weight="900">➔</text>
  </g>

  <!-- Step 3: CSW24 & Multipliers -->
  <g class="step-3" transform="translate(510, 30)">
    <rect width="200" height="160" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <rect x="0" y="0" width="200" height="32" rx="10" fill="#059669" fill-opacity="0.3"/>
    <text x="100" y="21" fill="#6ee7b7" font-family="'Inter', sans-serif" font-size="11" font-weight="900" text-anchor="middle">STEP 3 • ARBITRATION</text>
    <text x="100" y="70" font-size="28" text-anchor="middle">⚙️</text>
    <text x="100" y="105" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13" font-weight="800" text-anchor="middle">Lexicon &amp; Multipliers</text>
    <text x="100" y="125" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">
      <tspan x="100" dy="0">3L, 2L, Power Drops</tspan>
      <tspan x="100" dy="14">&amp; +50 Bingo bonuses</tspan>
    </text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <g class="arrow-anim" transform="translate(722, 105)">
    <text fill="#10b981" font-size="20" font-weight="900">➔</text>
  </g>

  <!-- Step 4: 1s Shield Window -->
  <g class="step-4" transform="translate(750, 30)">
    <rect width="200" height="160" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="0" y="0" width="200" height="32" rx="10" fill="#d97706" fill-opacity="0.3"/>
    <text x="100" y="21" fill="#fde68a" font-family="'Inter', sans-serif" font-size="11" font-weight="900" text-anchor="middle">STEP 4 • 1s SHIELD</text>
    <text x="100" y="70" font-size="28" text-anchor="middle">🛡️</text>
    <text x="100" y="105" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13" font-weight="800" text-anchor="middle">Defense Window</text>
    <text x="100" y="125" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">
      <tspan x="100" dy="0">1.0s reactive window</tspan>
      <tspan x="100" dy="14">to deflect attack damage</tspan>
    </text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <g class="arrow-anim" transform="translate(962, 105)">
    <text fill="#f59e0b" font-size="20" font-weight="900">➔</text>
  </g>

  <!-- Step 5: Combat & Sync -->
  <g class="step-5" transform="translate(980, 30)">
    <rect width="190" height="160" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="0" y="0" width="190" height="32" rx="10" fill="#b91c1c" fill-opacity="0.3"/>
    <text x="95" y="21" fill="#fca5a5" font-family="'Inter', sans-serif" font-size="11" font-weight="900" text-anchor="middle">STEP 5 • HP DAMAGE</text>
    <text x="95" y="70" font-size="28" text-anchor="middle">💥</text>
    <text x="95" y="105" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13" font-weight="800" text-anchor="middle">Lethal Strike</text>
    <text x="95" y="125" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">
      <tspan x="95" dy="0">Deduct HP from rivals</tspan>
      <tspan x="95" dy="14">Sync rack &amp; next turn</tspan>
    </text>
  </g>
</svg>
