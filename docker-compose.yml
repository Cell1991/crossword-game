services:

  frontend:
    build:
      context: ./frontend
    container_name: crossword-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: crossword-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  postgres:
    image: postgres:16
    container_name: crossword-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crossword
      POSTGRES_PASSWORD: crossword
      POSTGRES_DB: crossword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
