services:

  frontend:
    build:
      context: ./frontend
    container_name: crossword-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - HOSTNAME=0.0.0.0
      - PORT=3000
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: crossword-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://crossword:crossword@postgres:5432/crossword
      - SYNC_DATABASE_URL=postgresql://crossword:crossword@postgres:5432/crossword
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  postgres:
    image: postgres:16
    container_name: crossword-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crossword
      POSTGRES_PASSWORD: crossword
      POSTGRES_DB: crossword
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crossword"]
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

